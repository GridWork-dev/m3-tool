# Engine coolant on the E46 M3. Every source below was opened on 2026-11-24.
#
# Markets: `markets: [us]` (ruling R61). Every source is a BMW of North America document or a US
# English owner's manual, and a document for one market covers that market only. No European BMW
# schedule (service booklet or owner's handbook) was found: the M3 owner's manuals I opened in
# archive.org's BMW manuals collection are all US English editions, and web searches found no
# European one.
#
# Interval: `triggers: [lifetime-fill]`, alone and with no `miles` or `months` (the schema rejects
# both). The 2004 booklet says 'The engine coolant has a lifetime rating and does not need to be
# changed.' (p. 3). A lifetime-fill claim needs a Tier 1 source (`no-schedule-without-tier1`), and
# the booklet copy is Tier 1 under ruling R84, so the entry is `verified: true`. The owner's manual
# says how to check the level and add coolant and gives no change interval, so the claim rests on
# the booklet alone, a BMW NA document that speaks for US-market cars only.
#
# No shorter interval is recorded. A specialist's recommendation would go in `notes`, labelled as
# theirs, only if a Tier 1 or Tier 2 source stated one, and none I reopened does. BimmerWorld, a
# retailer (Tier 3), says fresh coolant is required with its pump and radiator overhaul; that is
# about the hardware and is in `e46-cooling-system-failure`.
#
# Tiers (data.md, 'Sources', rulings R77 and R84): the booklet copy and the owner's manual copy are
# both Tier 1.
#
# No cost is published: no Tier 1 or Tier 2 source gives a figure for this service, and price
# collection is a separate lane (data.md, 'Costs that are absent').
id: e46-coolant
generation: e46
engine: S54B32
markets: [us]
title: "Engine coolant"
interval:
  triggers: [lifetime-fill]
parts: []
fluids:
  - "Engine coolant"
inspectWhenBuying: false
sources:
  - title: "Service and Warranty Information, 2004 E46 M3 (SD 92-255, printed 9/03)"
    publisher: BMW of North America, LLC
    url: https://archive.org/download/manualzilla-id-7066322/7066322.pdf
    tier: 1
    accessed: 2026-11-24
    note: "Third-party copy on archive.org (item manualzilla-id-7066322, uploaded to archive.org from Manualzilla by a private account); the copy is complete (all 42 PDF pages) and nothing is missing. Tier 1 under data.md, 'Sources', ruling R84: it is BMW NA's own print file (QuarkXPress 5.01, Acrobat Distiller 4.05, created 2003-11-13, live text) with the line '© BMW of North America, LLC ... Printed in U.S.A. 9/03 SD 92-255' on the cover; the number fits BMW NA's sequence (SD 92-269, printed 08/04, on ManualsLib; SD 92-322, printed 07/06, on NHTSA's site); and the owner's manual (Tier 1) pp. 125-126 names 'the Service and Warranty Information Booklet for US models'. A BMW NA document, so it speaks for US-market cars only. Page numbers are the booklet's printed pages (PDF page = printed page + 3). 2004 model year. 'The engine coolant has a lifetime rating and does not need to be changed.' (p. 3, Maintenance System)."
  - title: "BMW M3 Owner's Manual, online edition for part no. 01 41 0 157 628 (09/03): Coolant, pp. 124-125"
    publisher: BMW AG
    url: https://archive.org/download/manualsonline-id-d3b68d3e-dade-4bda-875b-3716cdeabf3f/d3b68d3e-dade-4bda-875b-3716cdeabf3f.pdf
    tier: 1
    accessed: 2026-11-24
    note: "Archive.org copy of BMW's own 'Online Edition' PDF (complete, 170 pages, part no. 01 41 0 157 628, not retyped). Tier 1 under data.md, 'Sources' (R77): its part number and scope are corroborated (test 3) by ManualsLib's listing of the same 2004 M3 US English manual. A US English edition, so it supports the US market only. Covers checking the coolant level and adding coolant ('Checking the coolant level and adding coolant', pp. 124-125). It gives no coolant change interval and does not say the coolant is a lifetime fill."
verified: true
notes: "BMW's 2004 US booklet says 'The engine coolant has a lifetime rating and does not need to be changed.' (p. 3). That is about the fluid, and it covers the US-market car only. No shorter interval is recorded: no Tier 1 or Tier 2 source I reopened states one. The owner's manual (Tier 1) says how to check the coolant level and add coolant (pp. 124-125) and gives no change interval. The cooling system issue (`e46-cooling-system-failure`) covers water pump and radiator wear, which is about the hardware, not the fluid."
