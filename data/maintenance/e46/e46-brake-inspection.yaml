# Brake pad, rotor and parking brake checks on the 2004 US E46 M3. Every source below was opened on
# 2026-11-24.
#
# Markets: `markets: [us]` (ruling R61). Every source is a BMW of North America document or a US
# English owner's manual, and a document for one market covers that market only. No European BMW
# schedule (service booklet or owner's handbook) was found: the M3 owner's manuals I opened in
# archive.org's BMW manuals collection are all US English editions, and web searches found no
# European one.
#
# Model years: `modelYears: [2004, 2004]` (rulings R86 and R88). The 2004 booklet names the model
# year on its cover ('2004 E46 M3'), and the owner's manual (09/03) goes with it: the manual names
# no model year itself, and ManualsLib lists it as 'BMW M3 2004'. The 2005 checklist, ST050 and
# ST041 are Tier 2 copies and cannot widen the range on their own. I looked for another year's BMW
# document that is Tier 1 under R77 or R84 and says the same: the archive.org copies of BMW NA's US
# M3 booklets are for 2004 and for 2008 to 2010, and the 2005 booklet (SD 92-269) on ManualsLib is a
# viewer's re-rendering, so I could not show it is the native file. The other years' owner's manuals
# on archive.org name no model year in the document. The field is explicit because the US cars start
# in 2001, so no US item can leave it out (R88).
#
# Triggers: the booklet lists these checks at every Engine Oil Service (p. 5) and at Inspection I
# (p. 6), and Inspection II repeats every Inspection I item, so the list is [oil-service,
# inspection-i]. The booklet's brake line check is in the Inspection I list only, so it is its own
# entry (`e46-brake-line-check`) and is not covered by these triggers. The booklet gives no pad
# thickness limit and no mileage, so there is no number. The brake fluid change is a separate item
# (`e46-brake-fluid`).
#
# Tiers (data.md, 'Sources', rulings R77 and R84): the owner's manual copy and the booklet copy are
# Tier 1; the ST050 and ST041 copies are Tier 2, because they have no issuer line or module number.
#
# No cost is published: no Tier 1 or Tier 2 source gives a figure for this service, and price
# collection is a separate lane (data.md, 'Costs that are absent').
id: e46-brake-inspection
generation: e46
engine: S54B32
markets: [us]
modelYears: [2004, 2004]
title: "Brake pad, rotor and parking brake checks"
interval:
  triggers: [oil-service, inspection-i]
parts:
  - "disc brake pads, only if the check shows replacement is necessary"
fluids: []
inspectWhenBuying: false
sources:
  - title: "Service and Warranty Information, 2004 E46 M3 (SD 92-255, printed 9/03)"
    publisher: BMW of North America, LLC
    url: https://archive.org/download/manualzilla-id-7066322/7066322.pdf
    tier: 1
    accessed: 2026-11-24
    note: "Third-party copy on archive.org (item manualzilla-id-7066322, uploaded to archive.org from Manualzilla by a private account); the copy is complete (all 42 PDF pages) and nothing is missing. Tier 1 under data.md, 'Sources', ruling R84: it is BMW NA's own print file (QuarkXPress 5.01, Acrobat Distiller 4.05, created 2003-11-13, live text) with the line '© BMW of North America, LLC ... Printed in U.S.A. 9/03 SD 92-255' on the cover, which also names the model year ('2004 E46 M3'); the number fits BMW NA's sequence (SD 92-269, printed 08/04, on ManualsLib; SD 92-322, printed 07/06, on NHTSA's site); and the owner's manual (Tier 1) pp. 125-126 names 'the Service and Warranty Information Booklet for US models', which confirms what kind of document it is and that it serves the US market. A BMW NA document, so it speaks for US-market cars only. Page numbers are the booklet's printed pages (PDF page = printed page + 3). 2004 model year. Engine Oil Service (p. 5): 'Check overall thickness of rear disc brake pads using special tool.', 'If replacement is necessary: Examine brake disc surfaces. Clean brake pad contact points in calipers. Grease wheel centering hubs.', 'Check thickness of parking brake linings only when replacing rear pads.', 'Remove and install front disc brake pads, check overall thickness.', 'Examine brake disc surfaces. Clean brake pad contact points in calipers. Grease wheel centering hubs.' and 'Check parking brake actuation. Adjust if necessary.' Inspection I, Undercarriage (p. 6): the same pad checks ('Check thickness of parking brake linings only when replacing rear brake pads.', 'Remove and install front disc brake pads, check overall thickness. Examine disc surfaces. Clean brake pad contact points in calipers. Grease wheel centering hubs.') and 'Check parking brake actuation. Adjust if necessary.'"
verified: true
notes: "The 2004 US booklet lists these checks at every Engine Oil Service (p. 5) and every Inspection I (p. 6): 'Check overall thickness of rear disc brake pads using special tool.' with 'If replacement is necessary: Examine brake disc surfaces. Clean brake pad contact points in calipers. Grease wheel centering hubs.', 'Remove and install front disc brake pads, check overall thickness.' with 'Examine brake disc surfaces.' (Engine Oil Service; the Inspection I list reads 'Examine disc surfaces.'), 'Check thickness of parking brake linings only when replacing rear pads.' (Engine Oil Service; Inspection I reads 'rear brake pads'), and 'Check parking brake actuation. Adjust if necessary.' The booklet gives no pad thickness limit and no mileage: the checks fall due with the service the indicator shows. The brake line check is a separate entry, `e46-brake-line-check`, because the booklet lists it at Inspection I only. The only Tier 1 source for this item is the booklet, a third-party copy on archive.org accepted under ruling R84, so the item rests on that copy alone (data.md, 'Sources')."
