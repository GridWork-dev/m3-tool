# Engine coolant on the 2004 E46 M3. Every source below was opened on 2026-11-24.
#
# Markets: `markets: [us]` (ruling R61). Every source is a BMW of North America document or a US
# English owner's manual, and a document for one market covers that market only. No European BMW
# schedule (service booklet or owner's handbook) was found: the M3 owner's manuals I opened in
# archive.org's BMW manuals collection are all US English editions, and web searches found no
# European one.
#
# Model years: `modelYears: [2004, 2004]` (rulings R86 and R88): the 2004 booklet names 2004 on its
# cover. The bulletin's 'MY 2004 and Later' row would carry 2005 and 2006, but its copy is Tier 2,
# so it cannot extend the range. 2005 and 2006 therefore have no coolant entry. That is a gap
# (data.md, 'Model years'): no Tier 1 source gives a sourced coolant schedule for those years, and a
# gap is not a statement that there is none.
#
# Interval: `triggers: [lifetime-fill]`, alone and with no `miles` or `months` (the schema rejects
# both). The 2004 booklet says 'The engine coolant has a lifetime rating and does not need to be
# changed.' (p. 3). A lifetime-fill claim needs a Tier 1 source (`no-schedule-without-tier1`), and
# the booklet copy is Tier 1 under ruling R84, so the entry is `verified: true`. BMW NA's SI B17 01
# 07 (October 2007) lists 'All Models' under 'Long-Term' and 'No Replacement Interval' for 'MY 2004
# and Later', and corroborates the booklet; its copy is Tier 2 (the source note gives the R77
# tests), so it is not what the entry rests on.
#
# Gap: 2005 and 2006 have no coolant entry. Only the Tier 2 bulletin copy covers those years, and a
# lifetime-fill claim needs a Tier 1 source. Under data.md a gap between ranges means no source
# gives a schedule for those years, so the site says nothing about them; it does not mean there is
# no schedule. BMW changed the E46 coolant schedule from model year 2004 (ruling R86), so the 2001
# to 2003 entry is `e46-coolant-2001-2003`.
#
# No shorter interval is recorded. A specialist's recommendation would go in `notes`, labelled as
# theirs, only if a Tier 1 or Tier 2 source stated one, and none I reopened does. BimmerWorld, a
# retailer (Tier 3), says fresh coolant is required with its pump and radiator overhaul; that is
# about the hardware and is in `e46-cooling-system-failure`.
#
# Tiers (data.md, 'Sources', rulings R77 and R84): the booklet copy is Tier 1 under R84, and the
# bulletin copy is Tier 2 under R77.
#
# No cost is published: no Tier 1 or Tier 2 source gives a figure for this service, and price
# collection is a separate lane (data.md, 'Costs that are absent').
id: e46-coolant-2004
generation: e46
engine: S54B32
markets: [us]
modelYears: [2004, 2004]
title: "Engine coolant, model year 2004"
interval:
  triggers: [lifetime-fill]
parts: []
fluids:
  - "Engine coolant"
inspectWhenBuying: false
sources:
  - title: "Service and Warranty Information, 2004 E46 M3 (SD 92-255, printed 9/03)"
    publisher: BMW of North America, LLC
    url: https://archive.org/download/manualzilla-id-7066322/7066322.pdf
    tier: 1
    accessed: 2026-11-24
    note: "Third-party copy on archive.org (item manualzilla-id-7066322, uploaded to archive.org from Manualzilla by a private account); the copy is complete (all 42 PDF pages) and nothing is missing. Tier 1 under data.md, 'Sources', ruling R84: it is BMW NA's own print file (QuarkXPress 5.01, Acrobat Distiller 4.05, created 2003-11-13, live text) with the line '© BMW of North America, LLC ... Printed in U.S.A. 9/03 SD 92-255' on the cover, which also names the model year ('2004 E46 M3'); the number fits BMW NA's sequence (SD 92-269, printed 08/04, on ManualsLib; SD 92-322, printed 07/06, on NHTSA's site); and the owner's manual (Tier 1) pp. 125-126 names 'the Service and Warranty Information Booklet for US models', which confirms what kind of document it is and that it serves the US market. A BMW NA document, so it speaks for US-market cars only. Page numbers are the booklet's printed pages (PDF page = printed page + 3). 2004 model year. 'The engine coolant has a lifetime rating and does not need to be changed.' (p. 3, Maintenance System). Inspection I, Engine Compartment: 'Check coolant level and antifreeze protection level. Add coolant if required.' (p. 6)."
  - title: "SI B17 01 07: BMW Long-Term Antifreeze/Coolant: Maintenance, Repairs and Replacement Requirements (October 2007)"
    publisher: BMW of North America, LLC
    url: https://web.archive.org/web/20240619182054/http://www.exx.se/techinfo/docs/sib_170107.pdf
    tier: 2
    accessed: 2026-11-24
    note: "BMW NA service information bulletin SI B17 01 07, October 2007, in the 'Cooling System' and 'Warranties' categories, subject 'BMW Long-Term Antifreeze/Coolant: Maintenance, Repairs and Replacement Requirements'. Third-party copy: a three-page browser print of BMW's TIS page made in November 2008 (the footer reads 'http://www.bmwtis.com/tsb/bulletins/bulletin_graphic_temp/B170107g.htm 11/20/2008'; PDF metadata: PScript5.dll, Acrobat Distiller 8.1.0, created 2008-11-20), with '[ Copyright © 2007 BMW of North America, LLC ]'. The vendor file is on exx.se, a third party's server, not BMW's. The url is the existing Wayback snapshot of 2024-06-19, byte-identical to the vendor's file (same SHA-256 on 2026-11-24; the 2013-01-23 snapshot is identical too; no snapshot was created), and the Wayback index has only redirect captures of the bmwtis.com page. Tier 2 under data.md, 'Sources' (R77), judged strictly. Test 1 is met as a faithful print: all three pages, with the number, date, issuer line, model line and table intact and live text; but it is a 2008 print of the October 2007 text on a vendor's site, there is no original to compare it with, and it is not BMW's own PDF, so R84 does not apply. Test 2 is met: the host is named here and nothing is missing. Test 3 is only partly met: BMW NA's SI B17 03 16 (August 2016), published by NHTSA (document MC-10146818-9999), says 'Refer to SIB 17 01 07 for proper refilling of the coolant system after repairs of components that require coolant corrosion protection.', which corroborates the number and a refilling subject, but not the October 2007 revision, the model years or the summary table. The bulletin's own MODEL line names only '2003 E85 (Z4)' and '2004 and newer, all models'; the E46 rows for 2001 to 2003 are only in its summary table. Test 4 is met: the url is the existing snapshot. A June 2010 revision supersedes this one: a Tier 3 mirror's copy says it 'supersedes SI B17 01 07 dated October 2007'. Its E46 rows have not been seen, because the mirror's text has no summary table and no other copy was found. A BMW NA document, so it speaks for US-market cars only. Summary table (pp. 2-3): 'MY 2004 and Later' has 'All Models' in the 'Long-Term' column, headed 'No Replacement Interval'. The MODEL line (p. 1) reads '2004 and newer, all models'. p. 1: 'The antifreeze concentration of the coolant installed at the factory is valid for all areas of the U.S. and Canadian markets. This should be checked before the beginning of each winter for sufficient protection against freezing.' p. 2: 'BMW's Long-Term Antifreeze/Coolant can be used for all model years; however, its use does not eliminate or supercede a stated change interval.'"
verified: true
notes: "The 2004 US booklet says 'The engine coolant has a lifetime rating and does not need to be changed.' (p. 3), and BMW NA's SI B17 01 07 (October 2007, a Tier 2 copy) lists 'All Models' under 'Long-Term' and 'No Replacement Interval' for 'MY 2004 and Later'. The booklet also lists, under Inspection I, 'Check coolant level and antifreeze protection level. Add coolant if required.' (p. 6): the fluid is not changed on a schedule, and its level and protection are checked at every inspection. The bulletin (Tier 2 copy) adds a winter check of the antifreeze concentration: 'This should be checked before the beginning of each winter for sufficient protection against freezing.' (p. 1). The bulletin says BMW's long-term coolant 'can be used for all model years; however, its use does not eliminate or supercede a stated change interval.', which matters for older cars (see `e46-coolant-2001-2003`). 2005 and 2006 have no entry: only the Tier 2 bulletin copy covers them, so no sourced schedule is published for those years. The only Tier 1 source for this item is the booklet, a third-party copy on archive.org accepted under ruling R84, so the lifetime-fill claim rests on that copy alone (data.md, 'Sources'); the bulletin copy is Tier 2 corroboration."
