# Engine coolant on the 2004 to 2006 E46 M3. Every source below was opened on 2026-11-24.
#
# Markets: `markets: [us]` (ruling R61). Every source is a BMW of North America document or a US
# English owner's manual, and a document for one market covers that market only. No European BMW
# schedule (service booklet or owner's handbook) was found: the M3 owner's manuals I opened in
# archive.org's BMW manuals collection are all US English editions, and web searches found no
# European one.
#
# Model years: `modelYears: [2004, 2006]` (rulings R86 and R88). The 2004 booklet names 2004 on its
# cover; the bulletin's 'MY 2004 and Later' row names the later years, and 2006 is the last year of
# the generation's `years` (R88: the range stays inside them). A source that named 2007 would mean
# fixing the generation's `years` first (data.md, 'Model years').
#
# Interval: `triggers: [lifetime-fill]`, alone and with no `miles` or `months` (the schema rejects
# both). Two Tier 1 sources say it: the 2004 booklet, 'The engine coolant has a lifetime rating and
# does not need to be changed.' (p. 3), for model year 2004, and BMW NA's SI B17 01 07 (October
# 2007), which lists 'All Models' under 'Long-Term' and 'No Replacement Interval' for 'MY 2004 and
# Later'. The bulletin carries model years 2005 and 2006, so the range is [2004, 2006]: the
# bulletin's 'MY 2004 and Later' reaches the end of the E46's run (2006). BMW changed the E46
# coolant schedule from model year 2004, so the coolant is two items; the 2001 to 2003 item is
# `e46-coolant-2001-2003`. A lifetime-fill claim needs a Tier 1 source (`no-schedule-without-
# tier1`).
#
# No shorter interval is recorded. A specialist's recommendation would go in `notes`, labelled as
# theirs, only if a Tier 1 or Tier 2 source stated one, and none I reopened does. BimmerWorld, a
# retailer (Tier 3), says fresh coolant is required with its pump and radiator overhaul; that is
# about the hardware and is in `e46-cooling-system-failure`.
#
# Tiers (data.md, 'Sources', rulings R77 and R84): the booklet copy is Tier 1 under R84 and the
# bulletin copy is Tier 1 under R77, with the reasoning in each source note.
#
# No cost is published: no Tier 1 or Tier 2 source gives a figure for this service, and price
# collection is a separate lane (data.md, 'Costs that are absent').
id: e46-coolant-2004-2006
generation: e46
engine: S54B32
markets: [us]
modelYears: [2004, 2006]
title: "Engine coolant, model years 2004 to 2006"
interval:
  triggers: [lifetime-fill]
parts: []
fluids:
  - "Engine coolant"
inspectWhenBuying: false
sources:
  - title: "Service and Warranty Information, 2004 E46 M3 (SD 92-255, printed 9/03)"
    publisher: BMW of North America, LLC
    url: https://archive.org/download/manualzilla-id-7066322/7066322.pdf
    tier: 1
    accessed: 2026-11-24
    note: "Third-party copy on archive.org (item manualzilla-id-7066322, uploaded to archive.org from Manualzilla by a private account); the copy is complete (all 42 PDF pages) and nothing is missing. Tier 1 under data.md, 'Sources', ruling R84: it is BMW NA's own print file (QuarkXPress 5.01, Acrobat Distiller 4.05, created 2003-11-13, live text) with the line '© BMW of North America, LLC ... Printed in U.S.A. 9/03 SD 92-255' on the cover, which also names the model year ('2004 E46 M3'); the number fits BMW NA's sequence (SD 92-269, printed 08/04, on ManualsLib; SD 92-322, printed 07/06, on NHTSA's site); and the owner's manual (Tier 1) pp. 125-126 names 'the Service and Warranty Information Booklet for US models', which confirms what kind of document it is and that it serves the US market. A BMW NA document, so it speaks for US-market cars only. Page numbers are the booklet's printed pages (PDF page = printed page + 3). 2004 model year. 'The engine coolant has a lifetime rating and does not need to be changed.' (p. 3, Maintenance System). Inspection I, Engine Compartment: 'Check coolant level and antifreeze protection level. Add coolant if required.' (p. 6)."
  - title: "SI B17 01 07: BMW Long-Term Antifreeze/Coolant: Maintenance, Repairs and Replacement Requirements (October 2007)"
    publisher: BMW of North America, LLC
    url: https://web.archive.org/web/20240619182054/http://www.exx.se/techinfo/docs/sib_170107.pdf
    tier: 1
    accessed: 2026-11-24
    note: "BMW NA service information bulletin SI B17 01 07, October 2007, in the 'Cooling System' and 'Warranties' categories, subject 'BMW Long-Term Antifreeze/Coolant: Maintenance, Repairs and Replacement Requirements'. Third-party copy: a three-page browser print of BMW's TIS page (the footer reads 'http://www.bmwtis.com/tsb/bulletins/bulletin_graphic_temp/B170107g.htm 11/20/2008'; PDF metadata: PScript5.dll, Acrobat Distiller 8.1.0, created 2008-11-20), with '[ Copyright © 2007 BMW of North America, LLC ]'. The vendor file is on exx.se, a third party's server, not BMW's. The url is the existing Wayback snapshot of 2024-06-19, byte-identical to the vendor's file (same SHA-256 on 2026-11-24; the 2013-01-23 snapshot is identical too; no snapshot was created), and the Wayback index has only redirect captures of the bmwtis.com page. Tier 1 under data.md, 'Sources' (R77): test 1 passes, because the copy is the whole three pages with the number, date, issuer and model table intact, printed from the original page with live text, and not retyped (it is not BMW's own PDF, so R84 does not apply); test 2, the host is named here and nothing is missing; test 3, its number and what kind of document it is are corroborated by BMW NA's SI B17 03 16 (August 2016), published by NHTSA (document MC-10146818-9999), which says 'Refer to SIB 17 01 07 for proper refilling of the coolant system after repairs of components that require coolant corrosion protection.'; test 4, the url is the existing snapshot. The model-year rows of its table are not independently corroborated, and for model year 2001 a BMW owner's manual differs (see `e46-coolant-2001-2003`). A BMW NA document, so it speaks for US-market cars only. A Tier 3 mirror's copy of a June 2010 revision says it 'supersedes SI B17 01 07 dated October 2007'; only the October 2007 text was read here. Summary table (pp. 2-3): 'MY 2004 and Later' has 'All Models' in the 'Long-Term' column, headed 'No Replacement Interval'. The MODEL line (p. 1) reads '2004 and newer, all models'. p. 2: 'BMW's Long-Term Antifreeze/Coolant can be used for all model years; however, its use does not eliminate or supercede a stated change interval.'"
verified: true
notes: "BMW NA's SI B17 01 07 (October 2007) lists 'All Models' under 'Long-Term' and 'No Replacement Interval' for 'MY 2004 and Later', and the 2004 US booklet says 'The engine coolant has a lifetime rating and does not need to be changed.' (p. 3). Model years 2005 and 2006 rest on the bulletin alone: the booklet is for 2004. The booklet also lists, under Inspection I, 'Check coolant level and antifreeze protection level. Add coolant if required.' (p. 6, 2004): the fluid is not changed on a schedule, and its level and protection are checked at every inspection. The bulletin says BMW's long-term coolant 'can be used for all model years; however, its use does not eliminate or supercede a stated change interval.', which matters for older cars (see `e46-coolant-2001-2003`). Both Tier 1 sources are third-party copies, the booklet on archive.org under R84 and the bulletin as a Wayback snapshot of a vendor's print, so the item rests on those copies (data.md, 'Sources')."
