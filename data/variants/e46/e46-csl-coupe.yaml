# BMW M3 CSL (E46), 2003-2004. Every value below was checked against the sources cited here
# on 2026-11-23. paints and interiors are empty on purpose: BMW names two paints (Silver
# Grey Metallic, Black Sapphire Metallic) but no source opened gives a swatch colour, and
# the press kit gives no upholstery colour. The module asset ids below are planned names for
# the 3D lane; the front bumper id is a pick, because the docs name only the trunk lid and
# roof ids. The years run from the 2003 launch to 2004. The 2004 end is unverified: no
# source states when sales or production ended (Auto Express labels its CSL specifications
# '(2004)', carsales.com.au says the car became available in Australia in 2004, and only a
# Tier 3 AI-written page gives an end, 01/2004). Also unverified under data.md's rule: the
# optional-19 front width and offset, and the optional-19 tire sizes (only Koleso.ee, Tier 3).
