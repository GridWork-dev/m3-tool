# BMW M3 (E46) coupe, US market. Every value below was checked against the sources cited here on
# 2026-11-23. Power and weight have no field on a variant, so the sources' notes carry them (US
# rating 333 hp, 262 lb-ft). SMG reached the US in the 2002 model year; transmissions covers
# 2001 to 2006 as a whole.
# Model-wide statements (docs/standards/data.md, ruling R61): a model-wide statement in a Tier 1
# source, or in two Tier 2 sources from different publishers, covers every variant it does not
# explicitly exclude, and a document for one market covers that market only. Every file in this
# directory is read that way. Here that covers the optional-19 wheel and the tire sizes (the
# owner's manual's tire table, Tier 1, lists 'the M3').
# Paints. BMW's own documents name Imola Red, Carbon Black Metallic and Interlagos Blue Metallic
# for the US M3s (2006 press kit) and Laguna Seca Blue and Phoenix Yellow Metallic (2000
# release), and give no code. The seven other names (Alpine White III, Jet Black, Titanium
# Silver Metallic, Steel Grey Metallic, Topaz Blue Metallic, Mystic Blue Metallic, Oxford Green
# Metallic) and every code come from AutomotiveTouchup (Tier 3: a vehicle-keyed colour lookup)
# and agree with BIMMERtips and the BMW M Registry (Tier 3, which share one table). The registry
# is also the only source that says, by BMW model code, which paints the US coupe (BL93) offered
# and when. Name variants: the registry calls 405 'Imola Red II' and 430 'Oxford Green II
# metallic', and BIMMERtips calls 668 'Black II', 405 'Imola Red II' and 430 'Oxford Green II
# Metallic'; the names used here are BMW's own US wording where a BMW document gives one and
# AutomotiveTouchup's otherwise. The schema has no years field on a paint, so the months are
# here: Alpine White III 300 09/2000 to 08/2006; Jet Black 668 09/2000 to 08/2006; Imola Red 405
# 09/2000 to 08/2006; Laguna Seca Blue 448 09/2000 to 08/2004; Carbon Black Metallic 416 09/2000
# to 08/2006; Titanium Silver Metallic 354 09/2000 to 08/2006; Steel Grey Metallic 400 09/2000
# to 02/2003; Silver Grey Metallic A08 03/2003 to 08/2006; Topaz Blue Metallic 364 09/2000 to
# 02/2003; Mystic Blue Metallic A07 02/2003 to 08/2006; Interlagos Blue Metallic A30 12/2004 to
# 05/2006; Oxford Green Metallic 430 09/2000 to 08/2004; Phoenix Yellow Metallic 445 09/2000 to
# 02/2005. Interlagos Blue Metallic came with the Competition Package only (BMW NA's 2006 kit,
# Tier 1).
# Cross-checks: the registry's colours for the 2006 model year come to eight, five of them
# metallic, the count BMW NA's 2006 kit gives, and Auto123's 2004 spec page (Tier 3, Canada)
# lists the ten colours the registry has for 2004. Doubt: the registry's 2002 palette (ten
# colours) has no Tier 1 or Tier 2 confirmation.
# finish follows the paint's name: 'Metallic' in it means metallic. For Carbon Black Metallic,
# Silver Grey Metallic, Interlagos Blue Metallic, Phoenix Yellow Metallic that is BMW's own name
# (Tier 1). The metallic finishes of Titanium Silver Metallic, Steel Grey Metallic, Topaz Blue
# Metallic, Mystic Blue Metallic, Oxford Green Metallic follow names no BMW document gives (Tier
# 3). Alpine White III, Jet Black, Imola Red, Laguna Seca Blue are recorded as solid only
# because 'Metallic' is missing from the name: no source says solid (BIMMERtips counts four
# solids and ten metallics without naming them). No paint is recorded as pearl.
# baseColor is a render value, not a fact about the car, so it has no source (data.md). Each
# value is a flat sRGB mid-tone picked by eye from the paint's name and, where BMW gives one,
# its words (Interlagos Blue Metallic: 'a deep blue metallic, slightly darker than the former Le
# Mans Blue'). No photo or swatch was sampled, there is no flake or clearcoat in it, and the 3D
# lane may retune it.
# Interiors. BMW NA's 2006 kit (Tier 1) gives the Anthracite M Cloth/Nappa leather and the
# Alcantara/Nappa leather combination for the coupe, and says Nappa leather came in 'a choice of
# four colors' without naming them. The names Black, Grey, Imola Red and Cinnamon are the
# registry's regular US leather colours (Tier 3), and agree with Cars.com's lookup. The
# registry's other two, Laguna Seca Blue and Kiwi, were 'Priority 1 only' for the US (special
# order) and rest on the registry and Auto123 alone, so they are left out. The Alcantara
# combination's colours (Anthracite Alcantara, Black leather) are the registry's. The kit's
# description and features table list 'M Cloth/Nappa' and only its pricing sheet lists the
# 'Alcantara/Leather Combination', with the same terms (no charge, not available on the
# convertible), so for 2006 they may be one option under two names; the registry has the Impulse
# cloth ending 08/2005 and the Alcantara 'Priority 1 until 09/2005' for the US. Two are
# recorded, with no years.
# Unverified values are listed in the `unverified` field at the end of this file (data.md,
# "Unverified values"). The reasons for the paints, finishes and leathers are above. The wheel
# values fall below the rule (no Tier 1, fewer than two Tier 2 publishers) too: the Competition
# Package's rear offset is inferred (BimmerWorld alone calls part 36112282999 the ZCP rear, and
# BMW's UK parts page shows only that a 9.5Jx19 ET27 wheel fits the M3), and the 'Style 163M' label
# rests on BimmerWorld alone (BMW's kit says only 'M Cross Spoke').
# Not in `unverified`, because no field holds them: the months of all thirteen paints (the registry
# alone), with the doubt about 2002 above. The package has no years field: its dates are in the
# summary only.
id: e46-us-coupe
generation: e46
name: "M3 Coupe (US)"
market: us
body: coupe
transmissions: [6mt, smg]
years: [2001, 2006]
packages:
