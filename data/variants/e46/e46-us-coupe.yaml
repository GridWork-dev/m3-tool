    note: "Rated Tier 3: a vehicle-keyed colour lookup (a list of code and name pairs for one model year, with no product and no price on the page), not a specialist retailer's tech article or one of its own product listings, the same reasoning as for Koleso.ee's fitment lookup. It pairs codes with names: 300 Alpine White III, 354 Titanium Silver Metallic, 364 Topasblau Metallic (German form; the English 'Topaz Blue' is Tier 3 only), 400 Steel Gray Metallic, 405 Imola Red, 416 Carbon Black Metallic, 430 Oxford Green Metallic, 445 Phoenix Yellow Metallic, 448 Laguna Seca Blue, 475 Black Sapphire Metallic, 668 Jet Black. The page also lists colours the E46 M3 never had (Avus Blue Metallic and Techno Violet Metallic, for example), so it says nothing about which colours the M3 offered. With the two other Tier 3 tables it is all there is for the codes and for seven of the names (Alpine White III, Jet Black, Titanium Silver, Steel Grey, Topaz Blue, Mystic Blue, Oxford Green), so those are unverified under data.md's rule."
