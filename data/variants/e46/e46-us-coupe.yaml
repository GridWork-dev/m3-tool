    name: "Competition Package (ZCP)"
    summary: "US option from 2005 (BMW Canada's release says the package was available from December 2004). Per BMW North America it started with the CSL's 19-inch wheels, larger brakes with cross-drilled rotors, a 14.5:1 steering rack (15.4:1 standard), an Alcantara-wrapped steering wheel and M Track Mode for DSC, and it carried the exclusive Interlagos Blue paint (listed under paints; BMW NA says it was available only on the coupe with this package). Wheels are listed under factoryWheels as competition-19-style-163m."
  - id: sunroof
    name: "Glass sunroof"
    summary: "Optional electric glass sunroof, listed as optional equipment in the US owner's manual. No roof module asset is assigned to it yet."
