sources:
  - title: "BMW M3 Owner's Manual, online edition for part no. 01 41 0 157 628 (09/03): Engine data p. 150, Weights p. 152, sunroof p. 41, SMG p. 67, tires p. 27"
    publisher: "BMW AG"
    url: https://archive.org/download/manualsonline-id-d3b68d3e-dade-4bda-875b-3716cdeabf3f/d3b68d3e-dade-4bda-875b-3716cdeabf3f.pdf
    tier: 1
    accessed: 2026-11-23
    note: "Archive.org copy of the US-market M3 manual (power in hp, sizes in inches). The text describes a glass sunroof and never mentions a convertible top, so it is used for the coupe only. Engine data, p. 150: 333 hp at 7,900 rpm and 262 lb-ft at 4,900 rpm (the US rating; BMW's European rating is higher, see e46-euro-coupe). Weights, p. 152: curb weight 3,415 lb / 1,549 kg. P. 5 says an asterisk marks all optional equipment, and the electric glass sunroof (p. 41) and the Sequential M gearbox with Drivelogic (p. 67) carry it. Tire table, p. 27: 225/45 ZR 18 and 255/40 ZR 18 for the M3, and also 225/40 ZR 19 and 255/35 ZR 19. SMG reached the US in the 2002 model year (Cars.com: 'Later in the 2002 model year, a sequentially shifting manual transmission will become available'), so cars from the spring 2001 launch had the manual only. A variant's transmissions list cannot carry years, so [6mt, smg] covers 2001 to 2006 as a whole."
  - title: "ST041 M3 Complete Vehicle: E46 M3 Technical Data"
    publisher: "BMW Technical Training"
    url: https://archive.org/download/BMWTechnicalTrainingDocuments/ST041%20M3%20Complete%20Vehicle/1%20M3%20Complete%20Vehicle.pdf
    tier: 1
    accessed: 2026-11-23
    note: "BMW training module for the E46 M3 coupe (cover: Production Date 01/2001), copy hosted on archive.org; the file carries no publisher line. Gives 333 bhp at 7,900 rpm and 355 Nm at 4,900 rpm, a six-speed gearbox (Getrag) and a curb weight (DIN) of 1,495 kg. 01/2001 is the module's production date, not a launch date; it agrees with the 2001 start that Cars.com gives. The 1,495 kg disagrees with the owner's manual's 1,549 kg; a variant has no weight field, so neither is recorded in the data."
  - title: "THE ALL-NEW BMW M3 CONVERTIBLE MAKES ITS NORTH AMERICAN DEBUT AT THE 2008 NEW YORK INTERNATIONAL AUTO SHOW"
    publisher: "BMW Group"
    url: https://newsroom.bmwgroup.com/americas/the-all-new-bmw-m3-convertible-makes-its-north-american-debut-at-the-2008-new-york-international-auto-show
    tier: 2
    accessed: 2026-11-23
    note: "BMW of North America press release, 19 March 2008, about the 2008 M3 convertible; the sentence used here is a history aside inside a later release about another model, which data.md's Tier 1 (technical documents, product pages) does not cover, so it is rated Tier 2 like the other BMW-published retrospectives. Says 'The most-recent version, available from 2001-2006 as either a coupe or convertible, again was offered with six-cylinder power, this time providing 333 hp from its 3.2 liters. This vehicle was BMW's first use of SMG (Sequential Manual Gearbox) for the U.S. market.' Tier 2 source for the US 2001 to 2006 run of the coupe, the 333 hp US rating and the SMG's US debut; it gives no month or model year for either. Cars.com (Tier 2) and BMW Twenty Years (Tier 1) are the other sources for the run."
  - title: "2002 BMW M3: What's New"
    publisher: "Cars.com"
    url: https://www.cars.com/articles/2002-bmw-m3-whats-new-1420687120026
    tier: 2
    accessed: 2026-11-23
    note: "Rated Tier 2: staffed editorial content from a marketplace (data.md); its listings and fitment lookups would be Tier 3. Cars.com Editors (reporter Jim Flammang), posted 3/27/02. Says 'The high-performance BMW M3 coupe and convertible went on sale in spring 2001', the second source for the 2001 start, and 'Both M3 models have 18-inch tires for the front and rear and cast-alloy wheels'. Says 'Later in the 2002 model year, a sequentially shifting manual transmission will become available': the source for the US SMG year note. It also says 'Both the coupe and convertible seat four occupants on black M cloth and Nappa leather upholstery', which disagrees with BMW NA's 2006 kit (the M Cloth/Nappa leather is Anthracite, a coupe option, not offered on the convertible); the kit is used and this sentence is not."
  - title: "International presskit: Twenty Years of the BMW M3"
    publisher: "BMW Group"
    url: https://newsroom.bmwgroup.com/emea/international-presskit--twenty-years-of-the-bmw-m3
    tier: 1
    accessed: 2026-11-23
    note: "BMW Media Information 7/2007, with its six attached texts. Says towards the end of the year 2000 the E46-based M3 entered the market, based on the E46 coupé, and that production of the E46-based M3 ended in 2006. Its third-generation chapter says the US version is throttled to 333 SAE-hp (249 kW/338 DIN-hp) against the 252 kW/343 hp ECE version, and that 'entering the year 2005, BMW introduced' the Competition Package. Source for the 2006 end, the US rating and the package's 2005 introduction."
  - title: "Buyer's Guide: BMW E46 M3"
    publisher: "BMWBLOG"
    url: https://www.bmwblog.com/2022/04/18/buyers-guide-bmw-e46-m3/
    tier: 3
    accessed: 2026-11-23
    note: "Rated Tier 3: a blog. By Steven Paul, 18 April 2022. Says the E46 M3 is the M3 'produced between 2001 and 2006 model years', that it comes as a coupe or convertible with a six-speed manual or SMG II ('the one we've come to know stateside is SMG II'), and that a sunroof was an option. Says the Competition Package (option code ZCP) is 'the only way you can get' Interlagos Blue Metallic. It dates the package to 2004, which disagrees with BMW North America's 2005 and agrees with the December 2004 availability in BMW Canada's release; the package summary gives both."
  - title: "BMW NA 50th Anniversary, 50 Stories for 50 Years, Chapter 33: Just for U.S.: BMW of North America Creates Special Models with Enhanced Enthusiast Appeal"
    publisher: "BMW Group"
    url: https://newsroom.bmwgroup.com/americas/bmw-na-50th-anniversary--50-stories-for-50-years--chapter-33-just-for-us-bmw-of-north-america-creates-special-models-with-enhanced-enthusiast-appeal
    tier: 2
    accessed: 2026-11-23
    note: "Rated Tier 2: a BMW-published retrospective article, which data.md's Tier 1 (technical documents, product pages) does not cover. BMW of North America, 19 August 2025. Says that in 2005 BMW NA created the E46 M3 ZCP ('Z Competition Package') and that it started with the CSL's 19-inch Double Spoke wheels and Michelin Pilot Sport tires, larger brakes with cross-drilled iron rotors, a faster steering rack (14.5:1 rather than 15.4:1), an Alcantara-wrapped steering wheel and M Track Mode, in the exclusive colour Interlagos Blue. Source for the ZCP package and its 2005 start; the name 'ZCP' also appears in BimmerWorld's listings (Tier 2), and the Michelin tire mention rests on this chapter alone, so it is not used in the data. It also says the CSL was not street-legal in the US."
  - title: "New Competition Package for the BMW M3 Coupé. Attractive equipment for the exceptionally sportsminded driver."
    publisher: "BMW Group"
    url: https://newsroom.bmwgroup.com/americas/en-ca/new-competition-package-for-the-bmw-m3-coupe-attractive-equipment-for-the-exceptionally-sportsminded-driver/
    tier: 1
    accessed: 2026-11-23
    note: "BMW Canada, 16 November 2004. Describes the Competition Package for the M3 Coupé, available from December 2004: 19-inch wheels in the CSL's styling with 225/40 R 19 on 8Jx19 at the front and 255/35 R 19 on 9.5x19 at the rear, a 14.5:1 steering ratio, M Track mode, front discs enlarged by 20 mm to 345 mm, Alcantara on the steering wheel, handbrake lever and (with the Sequential M transmission) shift knob, and Interlagos Blue available only with the package. It describes the Canadian coupe; it is used here for the wheel widths and tire sizes, which the 50th-anniversary chapter does not give (BMW NA's 2006 kit, Tier 1, gives the same widths and tire sizes for the US coupe). BMW writes 'R 19'; the 'ZR' in the data comes from the owner's manual's 19-inch tire row for the same size."
  - title: "Genuine BMW E46 M3 ZCP Style 163M 19x8 ET47 Front Wheel"
    publisher: "BimmerWorld"
    url: https://www.bimmerworld.com/BMW-Parts/Genuine-BMW-E46-M3-M-cross-spoke-163-Wheel-8x19-36112282895.html
    tier: 2
    accessed: 2026-11-23
    note: "US specialist shop's listing: 'the original BMW wheel as used on the E46 M3 Competition Package (ZCP)', 19x8, ET47, part 36112282895, style 163M. Source for the ZCP front wheel's offset; with Koleso.ee (Tier 3) it is all there is for ET47, so the front offset is unverified under data.md's rule. The 'Style 163M' label rests on BimmerWorld's listings alone (one Tier 2 publisher; BMW NA's kit says only 'M Cross Spoke'), so the label is unverified too."
  - title: "Genuine BMW E46 M3 ZCP/CSL Style 163M 19x9.5 ET27 Rear Wheel"
    publisher: "BimmerWorld"
    url: https://www.bimmerworld.com/Wheels-Tires/Wheels/Genuine-BMW-E46-M3-M-cross-spoke-163-Wheel-95x19-36112282999.html
    tier: 2
    accessed: 2026-11-23
    note: "US specialist shop's listing: 'the original BMW wheel as used on the E46 M3 Competition Package (ZCP) and CSL', 19x9.5, ET27, part 36112282999, style 163M. Source for the ZCP rear wheel's offset. BMW's own UK parts listing shows that a 9.5Jx19 ET27 wheel with this part number fits the M3, but only this listing calls part 36112282999 the ZCP rear, so the rear offset is inferred through BimmerWorld and unverified under data.md's rule, like the front's."
  - title: "Genuine 19\" Wheel Rim Light Alloy 19 Inch 9.5Jx19 ET:27 36 11 2 282 999"
    publisher: "BMW Group (BMW Shop UK)"
    url: https://shop.bmw.co.uk/product/genuine-19-wheel-rim-light-alloy-19-inch-9-5jx19-et-27-36-11-2-282-999
    tier: 1
    accessed: 2026-11-23
    note: "BMW's own UK parts shop (a manufacturer product page). A 9.5Jx19 ET:27 light-alloy wheel, part 36112282999, whose compatibility table lists E46 M3 coupes (BL91 1999-07 to 2006-05, BL92 2000-03 to 2006-05), E46 M3 convertibles (BR91 2000-04 to 2006-08, BR92 2000-10 to 2006-08) and the M3 CSL (BL95, BL96), all ECE. The page gives no front or rear position; that this part is the rear of the CSL-style pair comes from BimmerWorld (Tier 2), which calls part 36112282999 the ZCP/CSL rear. So it is Tier 1 for a 9.5Jx19 ET27 wheel that fits these bodies, including the convertible, and Tier 2 for its position and its use on the Competition Package and the CSL. It does not speak for the optional 19-inch wheel: BMW NA's 2006 kit calls that wheel the 'M Double Spoke forged & polished (design #67M)', not the M Cross Spoke that BimmerWorld ties to this part number, so the optional wheel's rear offset (and, for the European cars, its rear width) is unverified. The production codes start before BMW's debut dates (the convertible's in 2000, BMW says spring 2001), so they are not used for start years; the coupe's May 2006 and the convertible's August 2006 ends agree with the 2006 end."
  - title: "BMW M3 E46 [2000 .. 2006] wheel fitment, 3.2i (S54B32)"
    publisher: "Koleso.ee (Astela OÜ)"
    url: https://koleso.ee/en/valuveljed/bmw/m3/263/e46-2000-2006/544
    tier: 3
    accessed: 2026-11-23
    note: "Rated Tier 3: a tire retailer's fitment lookup is neither a specialist retailer's tech article nor one of its own product listings, the two retailer pages data.md's Tier 2 covers. Fitment data for the E46 M3, without separating coupe and convertible. Lists the OEM front as 225/45R18 on 8Jx18 ET47 and the OEM rear as 255/40R18 on 9Jx18 ET26. It also lists a 19-inch pair, 225/40R19 on 8J ET47 and 255/35R19 on 9.5J ET27, without an OEM label. Second source for the widths and offsets of the 18-inch and optional 19-inch wheels."
  - title: "ALY59367 BMW M3 Wheel/Rim Hyper Silver #36112229950"
    publisher: "Hubcap Haven"
    url: https://www.hubcaphaven.com/p/3015/aly59367-bmw-m3-wheel-hyper-silver-36112229950.html
    tier: 2
    accessed: 2026-11-23
    note: "Retailer listing under OE part number 36112229950: style '10 Double Spoke (option code: Style 67)', 18x8, 5 lugs, 120 mm, offset 47 mm, fits the BMW M3 2001-2006 as a front wheel. Source for the 18-inch wheel's style name and, with the rear listing, its widths and offsets. This is the only Tier 2 publisher for the 18-inch offsets, so those are unverified under data.md's rule; the widths are also in BMW NA's 2006 kit (Tier 1), which calls the design 'M Double Spoke (design #67M)', and supports the 'Style 67' label."
  - title: "ALY59368/59607 BMW M3 Wheel/Rim Hyper Silver #36112229960"
    publisher: "Hubcap Haven"
    url: https://www.hubcaphaven.com/p/1705/aly59368-59607-bmw-m3-wheel-hyper-silver-36112229960.html
    tier: 2
    accessed: 2026-11-23
    note: "Retailer listing under OE part number 36112229960: style '10 Double Spoke (option code listed as Style 67)', 18x9, 5 lugs, 120 mm, offset 26 mm, fits the BMW M3 2001-2006 as a rear wheel."
  - title: "BMW Wheel Info and Tech Tips"
    publisher: "BimmerWorld"
    url: https://www.bimmerworld.com/About-Us/Wheel-Info-Tech/
    tier: 2
    accessed: 2026-11-23
    note: "Specialist shop's tech page. Its E46 M3 row lists 19x8.0 ET47 front and 19x9.5 ET27 rear as stock, and gives no 18-inch stock size (its Track A and Track B columns list 18x9.5 ET35 and 18x10.0 ET25, but as aftermarket recommendations). It agrees with the 19-inch widths and offsets used here. It calls the 19-inch pair stock, while BMW's CSL press kit calls the 19-inch wheels an option on the M3 (the 18-inch wheel is the standard fitment), so the pair is recorded as the optional wheel. The optional wheel's ET47 front offset rests on this shop alone at Tier 2 and is unverified under data.md's rule (BMW NA's 2006 kit, Tier 1, gives the 8.0 and 9.5 widths); its 9.5J ET27 rear offset rests on this shop alone at Tier 2 as well, because BMW's UK parts listing is for part 36112282999, a different design (see that listing's note)."
  - title: "BMW M3 CSL press kit (3/2003), Press Kit for BMW M3 CSL at the Geneva Motor Show 2003"
    publisher: "BMW Group"
    url: https://newsroom.bmwgroup.com/americas/press-kit-for-bmw-m3-csl-at-the-geneva-motor-show-2003
    tier: 1
    accessed: 2026-11-23
    note: "BMW's M3 CSL press kit (3/2003, PDF 'AG030228 M3 CSL Press Kit_GB_finalversion.pdf' linked from this page). Calls the 19-inch wheels 'available as an option on the M3' and describes them as forged ('the forged 19-inch wheels featured on the standard M3'), which is why the 19-inch pair is listed as an option and the 18-inch wheel as the standard fitment. For the CSL itself see e46-csl-coupe."
  - title: "PRESS KIT: 2006 BMW M3 (description, highlights, options and features, pricing)"
    publisher: "BMW Group"
    url: https://newsroom.bmwgroup.com/americas/press-kit-2006-bmw-m3
    tier: 1
    accessed: 2026-11-23
    note: "BMW of North America press kit for the 2006 model year, release dated 15 December 2005: five Word documents (description, highlights, options and features, specifications, and prices as of 1 September 2005), US models only, read from the page's download links. Features table: 'BMW M exterior paint selection' standard and 'Metallic paint' optional on the coupe and the convertible. The Sequential Manual Gearbox is optional on both. 'M Double Spoke (design #67M)' 18 x 8.0 front and 18 x 9.0 rear is standard, the 19-inch M Double Spoke 19 x 8.0 and 19 x 9.5 optional on both bodies, and the 'M Cross Spoke' 19 x 8.0 and 19 x 9.5 comes with the Competition Package (coupe only); tires 225/45ZR-18 and 255/40ZR-18, 225/40ZR-19 and 255/35ZR-19. Description: 'a choice of eight exterior colors, five of them metallic'; 'Special M colors: Imola Red, Carbon Black Metallic; also Interlagos Blue Metallic, available only on Coupe with Competition Package' ('a deep blue metallic, slightly darker than the former Le Mans Blue'); Nappa leather standard in both models 'in a choice of four colors' (not named); 'M Cloth/Nappa leather' a no-extra-cost coupe option, 'available in Anthracite only' and formerly standard; the pricing sheet lists 'Alcantara/Leather Combination Upholstery (Alcantara center with Nappa Leather on the sides)' at no charge on the coupe and not available on the convertible. The Competition Package 'became available for the Coupe in the '05 model year'. The description and features table list the M Cloth/Nappa leather and only the pricing sheet lists the Alcantara/Leather Combination, with the same terms (no charge, not available on the convertible), so for 2006 they may be one option under two names. It names no other paint, no leather colour and no paint code."
