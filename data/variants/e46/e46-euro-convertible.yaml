    name: "Alpine White III"
    finish: solid
    baseColor: "#f3f3f1"
  - code: "668"
    name: "Jet Black"
    finish: solid
    baseColor: "#0f0f11"
  - code: "405"
    name: "Imola Red"
    finish: solid
