# BMW M3 (E46) convertible, European market. Every value below was checked against the sources
# cited here on 2026-11-23. Right-hand-drive cars are not a separate variant.
# Model-wide statements (docs/standards/data.md, ruling R61): a model-wide statement in a Tier 1
# source, or in two Tier 2 sources from different publishers, covers every variant it does not
# explicitly exclude, and a document for one market covers that market only. Every file in this
# directory is read that way. Here that covers smg (BMW Twenty Years, Tier 1, speaks of 'the BMW
# M3 equipped with SMG'; Motor1 says the same of the E46) and the
# optional-19 wheel (BMW's CSL kit, Tier 1, says it was 'available as an option on the M3').
# Paints. BMW's documents I could open that name paints are US ones or concern the coupe, so
# which paints the European convertible (BR91, and BR92 for the right-hand-drive cars) offered
# rests on the BMW M Registry chart (Tier 3, which BIMMERtips partly repeats) alone. The names
# Imola Red, Carbon Black Metallic, Laguna Seca Blue and Phoenix Yellow Metallic are BMW's (US
# documents); the seven others (Alpine White III, Jet Black, Titanium Silver Metallic, Steel
# Grey Metallic, Topaz Blue Metallic, Mystic Blue Metallic, Oxford Green Metallic) and every
# code come from AutomotiveTouchup (Tier 3: a vehicle-keyed colour lookup), which the two other
# Tier 3 tables repeat. Interlagos Blue Metallic is left out: the registry lists it for the
# coupe's Competition Package only. Name variants: the registry calls 405 'Imola Red II' and 430
# 'Oxford Green II metallic', and BIMMERtips calls 668 'Black II', 405 'Imola Red II' and 430
# 'Oxford Green II Metallic'; the names used here are BMW's own US wording where a BMW document
# gives one and AutomotiveTouchup's otherwise. The schema has no years field on a paint, so the
# months are here: Alpine White III 300 09/2000 to 08/2006; Jet Black 668 09/2000 to 08/2006;
# Imola Red 405 09/2000 to 08/2006; Laguna Seca Blue 448 09/2000 to 08/2004; Carbon Black
# Metallic 416 09/2000 to 08/2006; Titanium Silver Metallic 354 09/2000 to 08/2006; Steel Grey
# Metallic 400 09/2000 to 02/2003; Silver Grey Metallic A08 03/2003 to 08/2006; Topaz Blue
# Metallic 364 09/2000 to 02/2003; Mystic Blue Metallic A07 02/2003 to 08/2006; Oxford Green
# Metallic 430 09/2000 to 08/2004; Phoenix Yellow Metallic 445 09/2000 to 02/2005.
# finish follows the paint's name: 'Metallic' in it means metallic. For Carbon Black Metallic,
# Silver Grey Metallic, Phoenix Yellow Metallic that is BMW's own name (Tier 1). The metallic
# finishes of Titanium Silver Metallic, Steel Grey Metallic, Topaz Blue Metallic, Mystic Blue
# Metallic, Oxford Green Metallic follow names no BMW document gives (Tier 3). Alpine White III,
# Jet Black, Imola Red, Laguna Seca Blue are recorded as solid only because 'Metallic' is
# missing from the name: no source says solid (BIMMERtips counts four solids and ten metallics
# without naming them). No paint is recorded as pearl.
# baseColor is a render value, not a fact about the car, so it has no source (data.md). Each
# value is a flat sRGB mid-tone picked by eye from the paint's name (BMW's documents give no
# description of these colours). No photo or swatch was sampled, there is no flake or clearcoat
# in it, and the 3D lane may retune it.
# Interiors are empty on purpose: the only per-market source for the European convertible's
# upholstery is the registry (Tier 3), which has no Tier 1 or Tier 2 check for Europe, so none
# is recorded.
# Unverified under data.md's rule (no Tier 1, fewer than two Tier 2 publishers): the widths and
# offsets of standard-18 and of the optional-19 front and rear, and the tire sizes of both
# wheels (no
# Euro source above Tier 3 states them); the 'Style 67' label (Hubcap Haven alone for the Euro
# cars); every paint code (Tier 3 only); the seven paint names no BMW document gives (Alpine
# White III, Jet Black, Titanium Silver Metallic, Steel Grey Metallic, Topaz Blue Metallic,
# Mystic Blue Metallic, Oxford Green Metallic, Tier 3 only); the solid finishes of Alpine White
# III, Jet Black, Imola Red, Laguna Seca Blue (inferred from 'Metallic' missing in the name; no
# source says solid); the metallic finishes of Titanium Silver Metallic, Steel Grey Metallic,
# Topaz Blue Metallic, Mystic Blue Metallic, Oxford Green Metallic (they follow Tier 3 names);
# the availability of all twelve paints and their months (the registry, Tier 3, alone); that
# Interlagos Blue Metallic was not offered on the convertible (the registry lists it for the
# coupe's Competition Package only; Tier 3).
id: e46-euro-convertible
generation: e46
name: "M3 Convertible (Euro)"
market: euro
body: convertible
transmissions: [6mt, smg]
years: [2001, 2006]
packages: []
