    tier: 2
    accessed: 2026-11-23
    note: "By Motorious Staff, 22 January 2019. The checklist on the page is labelled 'Your AutoClassics BMW M3 E46 inspection checklist', so the text appears to be syndicated, and it names no market. Says the 1,200-mile service 'was essential to remove the preparatory running-in oil' and that cars 'built from 2001-2003' 'may have been the subject of a recall for problems with big-end bearings. Check to see whether any models you are looking at was subject to that recall and, if so, ensure the work was carried out. If not, engine failure could be the end of the game.' It gives no scope and no remedy."
