    accessed: 2026-11-23
    note: "By Freddy 'Tavarish' Hernandez, 19 June 2014 (the page says it is from APiDA Online, so it is an outside author's post), and it names no market. Says 'They were improperly sized at the factory, leading to premature catastrophic failures of the engines.' Its recall number, 'SIB 11-04-04', is a BMW North America bulletin, so Jalopnik's remarks about completing the recall are not used here for European cars."
  - title: "Buyer's Guide: BMW E46 M3 (2000-2006)"
