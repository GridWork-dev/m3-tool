# Connecting rod bearing wear on European cars. Every source below was opened on 2026-11-23.
#
# Markets: `markets: [euro]` (ruling R82). This is the twin of `e46-rod-bearing-wear`, whose fix and
# `verified: true` rest entirely on BMW of North America bulletins, which are US documents, so that
# entry is `[us]` only (data.md, ruling R61). Shown alone it would hide the S54's best-known problem
# from European owners, so this entry carries what the evidence supports for them.
#
# Evidence for Europe: PistonHeads (a guide that concentrates on Euro-spec cars) says affected
# early cars should have been repaired under warranty or had the engine replaced by BMW, and
# Motorious reports a recall. Jalopnik, MotorBiscuit and ECS Tuning name no market for the
# statements used here, so they are read as model-wide. No BMW document for European cars was
# found: BMW's remedy, the build range and any limits for them are not sourced.
#
# No fix, on purpose. ECS Tuning ties its recommendation to 'BMW's technical service bulletin
# update' without naming it, and the only BMW bulletins found (the one Jalopnik cites as 'SIB
# 11-04-04', and its companion) are BMW North America documents for US cars. PistonHeads and
# Motorious say a repair or a recall happened but give no scope and no remedy. So no Tier 1 or Tier
# 2 source here is shown to support a fix for European cars, and the entry is unverified.
#
# Contested, and worded that way: the cause (Jalopnik 'improperly sized', ECS 'did not spec ...
# correctly'), and whether a repaired car needs a repeat service (ECS, which sells a bearing kit,
# says about every 100,000 miles). `frequency: common` rests on editorial wording ('Some early cars
# suffered ...', 'all cars before 2003 will need the rod bearings done'). No source gives a rate.
id: e46-rod-bearing-wear-euro
generation: e46
engine: S54B32
markets: [euro]
title: Connecting rod bearing wear (European market)
symptoms:
  - "None is named in the sources opened here. Motorious says that if the recall work was not carried out, 'engine failure could be the end of the game'."
  - "On early cars the fault showed at low mileage. PistonHeads, writing of 'crank bearing failures' on early cars, says the fault 'seemed to rear its head at around 30,000 miles'."
cause: "Sources word the cause differently. Jalopnik says the bearings 'were improperly sized at the factory, leading to premature catastrophic failures of the engines', and ECS Tuning says BMW 'did not spec the rod bearing sizes correctly, which causes premature wear and eventual failure'. This entry does not choose between them, and BMW's own account of the cause for European cars is not sourced. PistonHeads and Motorious say early cars were affected: PistonHeads says 'Some early cars suffered crank bearing failures', Motorious says cars built from 2001 to 2003 'may have been the subject of a recall for problems with big-end bearings', and MotorBiscuit says 'all cars before 2003 will need the rod bearings done'. Which European cars and build dates BMW covered is not sourced here."
prevention: "Ask for proof that BMW repaired the bearings. PistonHeads says all of the affected early cars 'should have been repaired under warranty or had the engine replaced by BMW', and Motorious says to check whether the car was subject to the recall and, if so, that the work was carried out. The remedy, the build range and any limits for European cars are not sourced here, so do not assume the terms BMW North America set for US cars apply. PistonHeads and Motorious both call the original 1,200-mile oil service essential, so ask whether it was done. ECS Tuning, which sells a bearing kit, says a rod bearing service about every 100,000 miles is 'imperative' and ties that to BMW's bulletin update. No source here says whether a repaired European car needs more. This entry takes no side."
frequency: common
inspectWhenBuying: true
howToCheck: "For a car built from 2001 to 2003, ask for BMW or dealer paperwork showing the bearings were repaired or the engine replaced, with its date and mileage. Ask whether the original 1,200-mile oil service was done."
sources:
  - title: "BMW M3 (E46) | PH Used Buying Guide"
    publisher: PistonHeads
