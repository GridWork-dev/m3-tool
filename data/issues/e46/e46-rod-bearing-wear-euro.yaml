    tier: 2
    accessed: 2026-11-23
    note: "By PH Staff, 1 April 2021 (a UK guide that concentrates on Euro-spec cars: 'we'll concentrate on Euro-spec models in this guide'). Says 'Some early cars suffered crank bearing failures, but all of these affected cars should have been repaired under warranty or had the engine replaced by BMW. The fault seemed to rear its head at around 30,000 miles', and that the 1,200-mile running-in service 'included an oil change that has proved essential to the M3's long-term health'. It writes 'crank bearing failures'; this entry reads that as the rod bearing fault. It names no remedy, scope or limit."
