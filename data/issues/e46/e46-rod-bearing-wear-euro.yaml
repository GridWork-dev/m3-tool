# Connecting rod bearing wear on European cars. Every source below was opened on 2026-11-23.
#
# Markets: `markets: [euro]` (ruling R82, data.md "Markets"). This is the European twin of
# `e46-rod-bearing-wear-us`, whose fix and `verified: true` rest entirely on BMW of North America
# bulletins, which are US documents (data.md, ruling R61). Shown alone, the US entry would hide the
# S54's best-known problem from European owners, so this entry carries what the evidence supports
# for them. A market without its own sourced remedy keeps an unverified entry.
#
# Evidence for Europe, each worded as the source words it. PistonHeads (a guide that concentrates
# on Euro-spec cars) writes 'Some early cars suffered crank bearing failures' and that 'all of these
# affected cars should have been repaired under warranty or had the engine replaced by BMW'. That
# is a judgement about cars that failed, not a report of what BMW did. Motorious says cars built
# from 2001 to 2003 'may have been the subject of a recall for problems with big-end bearings', and
# is hedged. Jalopnik, MotorBiscuit and ECS Tuning name no market for the statements used here, so
# two different publishers' statements are read as model-wide (R61). No BMW document for European
# cars was found: BMW's remedy, the build range and any limits for them are not sourced.
#
# The fix is the market-neutral one that ECS Tuning and MotorBiscuit state, scoped as they scope it
# and no further. None of the terms of BMW North America's US service action (the break-in limit,
# the DME step) is claimed. The entry is `verified: false`: the fix rests on two Tier 2 publishers,
# one of which sells a bearing kit, and no BMW document speaks for European cars.
#
# Contested, and worded that way: the cause (Jalopnik 'improperly sized', ECS 'did not spec ...
# correctly'), and whether a repaired car needs a repeat service (ECS, which sells a bearing kit,
# says it does). `frequency: common` rests on editorial wording ('Some early cars suffered ...',
# 'all cars before 2003 will need the rod bearings done'). No source gives a rate.
id: e46-rod-bearing-wear-euro
generation: e46
engine: S54B32
markets: [euro]
title: Connecting rod bearing wear (European market)
symptoms:
  - "Bearing failure, and with it engine failure. Jalopnik says the bearings led to 'premature catastrophic failures of the engines', and PistonHeads writes of 'crank bearing failures' on early cars."
  - "On early cars it showed at low mileage. PistonHeads, writing of 'crank bearing failures', says the fault 'seemed to rear its head at around 30,000 miles'."
cause: "None of the sources names a warning sign before failure. They word the cause differently. Jalopnik says the bearings 'were improperly sized at the factory, leading to premature catastrophic failures of the engines', and ECS Tuning says BMW 'did not spec the rod bearing sizes correctly, which causes premature wear and eventual failure'. This entry does not choose between them, and BMW's own account of the cause for European cars is not sourced. PistonHeads writes 'Some early cars suffered crank bearing failures', Motorious says cars built from 2001 to 2003 'may have been the subject of a recall for problems with big-end bearings', and MotorBiscuit says 'all cars before 2003 will need the rod bearings done'. Which European cars and build dates BMW covered is not sourced here."
fix: "If there is no record that the bearings were done within roughly the last 100,000 miles, have the connecting rod bearings done. ECS Tuning says 'the solution is effectively 100k mile rod bearing service', and MotorBiscuit says 'all cars before 2003 will need the rod bearings done'. Neither names a market, and neither names BMW's remedy, build range or limits for European cars, which are not sourced here, so none of the terms of BMW North America's US service action is claimed. No cost is published, because no source says who does the work or what a price would cover."
prevention: "Ask whether BMW repaired or recalled the car, and if so whether the work was done. Motorious says cars built from 2001 to 2003 'may have been the subject of a recall', and to check whether the car was and, if so, that the work was carried out. PistonHeads says the early cars that suffered bearing failures 'should have been repaired under warranty or had the engine replaced by BMW'. PistonHeads and Motorious both call the original 1,200-mile oil service essential, so ask whether it was done. Contested: whether a repaired car needs a repeat service. ECS Tuning, which sells a bearing kit, says a rod bearing service about every 100,000 miles is 'imperative', and that if the service happened at 50,000 miles on a car now at 90,000 miles, you will 'still need to do those rod bearings in roughly 60k miles'. Jalopnik says an early car 'with this recall done should be regarded as just as good as the later models', but the recall it means is BMW North America's US bulletin, so that is not evidence about European cars. No other source here speaks to whether a repaired European car needs more. This entry takes no side."
frequency: common
inspectWhenBuying: true
howToCheck: "For a car built from 2001 to 2003, ask the seller whether BMW repaired or recalled the car for the bearings, and ask for any paperwork showing what was done, with its date and mileage. Ask whether the original 1,200-mile oil service was done."
sources:
  - title: "BMW M3 (E46) | PH Used Buying Guide"
    publisher: PistonHeads
    url: https://www.pistonheads.com/features/ph-buying-guides/bmw-m3-e46--ph-used-buying-guide/25931
    tier: 2
    accessed: 2026-11-23
    note: "By PH Staff, 1 April 2021 (a UK guide that concentrates on Euro-spec cars: 'we'll concentrate on Euro-spec models in this guide'). Says 'Some early cars suffered crank bearing failures, but all of these affected cars should have been repaired under warranty or had the engine replaced by BMW. The fault seemed to rear its head at around 30,000 miles', and that the 1,200-mile running-in service 'included an oil change that has proved essential to the M3's long-term health'. The 'should have been repaired' is a judgement about the cars that failed, and it names no part, scope or limit. It writes 'crank bearing failures'; this entry reads that as the rod bearing fault."
  - title: 2002-2007 BMW M3 E46 Buying Guide
    publisher: Motorious
    url: https://www.motorious.com/articles/highlights/2002-2007-bmw-m3-e46-buying-guide
    tier: 2
    accessed: 2026-11-23
    note: "By Motorious Staff, 22 January 2019. The checklist on the page is labelled 'Your AutoClassics BMW M3 E46 inspection checklist', so the text appears to be syndicated, and it names no market. Says the 1,200-mile service 'was essential to remove the preparatory running-in oil' and that cars 'built from 2001-2003' 'may have been the subject of a recall for problems with big-end bearings. Check to see whether any models you are looking at was subject to that recall and, if so, ensure the work was carried out. If not, engine failure could be the end of the game.' It is hedged ('may have been'), and gives no scope and no remedy."
  - title: "The Affordable Supercar: The Ultimate E46 M3 Buyer's Guide"
    publisher: Jalopnik
    url: https://jalopnik.com/the-affordable-supercar-the-ultimate-e46-m3-buyers-gui-1593133171
    tier: 2
    accessed: 2026-11-23
    note: "By Freddy 'Tavarish' Hernandez, 19 June 2014 (the page says it is from APiDA Online, so it is an outside author's post), and it names no market. Says 'They were improperly sized at the factory, leading to premature catastrophic failures of the engines.' Its recall number, 'SIB 11-04-04', is a BMW North America bulletin, so Jalopnik's remarks about completing the recall are not used here for European cars. It says 'An early M3 with this recall done should be regarded as just as good as the later models.', which the entry reports only to say it concerns the US recall."
  - title: "Buyer's Guide: BMW E46 M3 (2000-2006)"
    publisher: MotorBiscuit
    url: https://www.motorbiscuit.com/buyers-guide-bmw-e46-m3-2000-2006
    tier: 2
    accessed: 2026-11-23
    note: "By Chase Bierenkoven, 7 July 2021, and it names no market. Says 'all cars before 2003 will need the rod bearings done'. Used for the fix and for `frequency`. The line is wider than BMW North America's US bulletin (cars built to 22 May 2003), which is why the fix is worded as MotorBiscuit words it. Its $1,500 figure is not used (ruling R78): the page does not say who does the work or what is included."
  - title: Most Common BMW E46 M3 Problems
    publisher: ECS Tuning
    url: https://blog.ecstuning.com/most-common-bmw-e46-m3-problems/
    tier: 2
    accessed: 2026-11-23
    note: "Specialist retailer's tech article (Tier 2 under data.md); ECS sells the bearing kit it mentions ('our WPC Treated Rod Bearing Service Kit'), and the page names no market. By Craig Daugherty, 5 November 2020. Says 'BMW did not spec the rod bearing sizes correctly, which causes premature wear and eventual failure', 'Unfortunately, the solution is effectively 100k mile rod bearing service', and 'While they may last longer than the 100k mile interval outlined by BMW's technical service bulletin update, a 100k mile service is imperative to keep your S54 happy and healthy.' It also says 'If the service happened at 50k miles, and your potential car has 90k miles, you'll still need to do those rod bearings in roughly 60k miles.' It does not name the bulletin update it mentions, and the only BMW bulletins found are for US cars."
verified: false
