# Failure of the SMG II hydraulic pump. Applies to cars with the SMG gearbox only. Every source
# below was opened on 2026-11-23.
#
# No fix and no cost are published. The sources say the pump can be replaced, but none gives a
# shop cost: ECS Tuning says only that the pump mechanism is now sold separately for 'a few
# hundred dollars', which is a parts figure, and PistonHeads says replacement is 'costly'. A fix
# needs a cost (data.md), so the issue publishes symptoms, cause and how common it is.
#
# Market: the BMW document is a training module for the US-market car (it gives pressures in
# bar). PistonHeads writes about Euro-spec cars.
id: e46-smg-hydraulic-pump-failure
generation: e46
title: SMG hydraulic pump failure
symptoms:
  - "The gearbox warning lamp comes on and no further gearshifts are allowed when hydraulic pressure fails to build. The reserve pressure then puts the gearbox in neutral when the car stops."
  - "The gearbox drops into neutral, which PistonHeads names as the result of a pump failure."
  - "ECS Tuning says a failed pump 'renders your E46 M3 useless'."
cause: "The SMG II pump is a piston pump driven by an electric motor through a relay, and it keeps the hydraulic pressure between 45 and 80 bar (BMW training document). ECS Tuning says it is common for the pump to fail, and Jalopnik cites the SMG's 'inability to keep the SMG pump working for a prolonged time'. PistonHeads warns that a failing relay can be misdiagnosed as a pump failure, and says a new relay is easy and cheap to replace. Neither a failure rate nor a cause of the pump wear is given in the sources opened here."
prevention: "On an SMG car, ask whether the pump has been replaced and when: ECS Tuning says to address the pump unless it was replaced recently. Have the relay tested before paying for a pump, as PistonHeads advises."
frequency: common
inspectWhenBuying: true
howToCheck: "On an SMG car, ask for records of any pump replacement. On the test drive, watch for the gearbox warning lamp and for the gearbox dropping into neutral."
sources:
  - title: "ST041 M3 Complete Vehicle: SMG II"
    publisher: BMW Technical Training
    url: https://archive.org/download/BMWTechnicalTrainingDocuments/ST041%20M3%20Complete%20Vehicle/5%20SMG.pdf
    tier: 1
    accessed: 2026-11-23
    note: "BMW training module for the E46 M3, copy hosted on archive.org; the file carries no publisher line. 'Hydraulic Pump' (printed page 11): 'The pump is a piston pump driven by an electric motor, actuated by the SMG control unit via a relay so that oil pressure is always between 45 and 80 bar.' and 'In the event of a hydraulic system failure the gearbox warning lamp is turned on in the IKE and if hydraulic pressure fails to build, no further gearshifts are allowed. This allows the reserve pressure in the accumulator to be used to place the gearbox in the Neutral position when the vehicle comes to a stop.' It lists no failure rate."
  - title: Most Common BMW E46 M3 Problems
    publisher: ECS Tuning
    url: https://blog.ecstuning.com/most-common-bmw-e46-m3-problems/
    tier: 2
    accessed: 2026-11-23
    note: "Specialist retailer's tech article (Tier 2 under data.md). By Craig Daugherty, 5 November 2020. Says 'It is common for the SMG pump to fail, which renders your E46 M3 useless', that 'the physical mechanism itself is available separately, making this a few hundred dollars rather than thousands', and 'The SMG pump is something you should address unless you see that your example has had a recent replacement prior to your ownership.' The few-hundred-dollars figure is a parts price and is not used as a cost."
  - title: "BMW M3 (E46) | PH Used Buying Guide"
    publisher: PistonHeads
    url: https://www.pistonheads.com/features/ph-buying-guides/bmw-m3-e46--ph-used-buying-guide/25931
    tier: 2
    accessed: 2026-11-23
    note: "By PH Staff, 1 April 2021 (a UK guide that concentrates on Euro-spec cars). Says 'The SMG's hydraulic fluid pump can fail, leading to the gearbox dropping into neutral. Replacing the pump is costly, but this can also be misdiagnosed when the relay is failing, and a new relay is easy and cheap to replace.'"
  - title: "The Affordable Supercar: The Ultimate E46 M3 Buyer's Guide"
    publisher: Jalopnik
    url: https://jalopnik.com/the-affordable-supercar-the-ultimate-e46-m3-buyers-gui-1593133171
    tier: 2
    accessed: 2026-11-23
    note: "By Freddy 'Tavarish' Hernandez, 19 June 2014 (the page says it is from APiDA Online). Advises skipping the SMG for 'its inability to keep the SMG pump working for a prolonged time'."
verified: true
