# VANOS (variable valve timing) wear on the S54. Every source below was opened on 2026-11-23.
#
# Market: the sources are editorial guides, not market-specific BMW documents. PistonHeads writes
# about Euro-spec cars, the others are US-facing.
#
# Contested or thin, and worded that way:
# - ECS Tuning sells VANOS kits and recommends service with updated hubs, while PistonHeads says
#   the E46 M3's double VANOS is 'more robust' than the E36 version. None of the sources gives a
#   failure rate, so `frequency` rests on their wording ('a known issue', 'can give all sorts of
#   issues').
# - Jalopnik reports a voluntary BMW service action on the VANOS solenoid and cites a bulletin
#   number. The bulletin was not found, so the number is not repeated here.
#
# The cost is MotorBiscuit's $500 to $800 for a rebuild (2021).
id: e46-vanos-wear
generation: e46
engine: S54B32
title: VANOS variable valve timing wear
symptoms:
  - "A rattle from the top of the engine, described by Motorious as a marble in a tin can, which can mean VANOS pump wear."
  - "Limp mode with engine warning lights and stored fault codes, which Motorious says can point to the VANOS solenoid or a larger VANOS failure."
cause: "More than one VANOS part wears. ECS Tuning says tabs on the camshaft hubs tend to break off and reach the timing chain, and PistonHeads says the VANOS bolts can loosen at around 70,000 miles and, if they break, can ruin the engine. Motorious names VANOS pump wear and the solenoid. Jalopnik reports a voluntary BMW service action covering the VANOS solenoid, which it says 'would seal improperly and fail over time'; BMW's own bulletin was not available to check. ECS sells VANOS kits, and PistonHeads calls the E46 M3's double VANOS 'more robust' than the E36 version. None of the sources gives a failure rate."
fix: "Service or rebuild the VANOS units and fit the updated parts. ECS Tuning says the service should include updated camshaft hubs, and PistonHeads says stronger replacement bolts are available from BMW. MotorBiscuit (2021) puts a rebuild at $500 to $800."
prevention: "Listen for the top-end rattle on a cold start, and check for engine warning lights and stored fault codes. Ask for records of any VANOS service and whether it included updated hubs and bolts."
cost:
  currency: USD
  shop: [500, 800]
frequency: common
inspectWhenBuying: true
howToCheck: "Listen for a rattle from the top of the engine. Check for engine warning lights and stored fault codes with a proper code reader, which Motorious says is safer than a phone app on a Bluetooth adapter. Ask for VANOS service records."
sources:
  - title: Most Common BMW E46 M3 Problems
    publisher: ECS Tuning
    url: https://blog.ecstuning.com/most-common-bmw-e46-m3-problems/
    tier: 2
    accessed: 2026-11-23
    note: "Specialist retailer's tech article (Tier 2 under data.md); ECS sells the VANOS kit it mentions. By Craig Daugherty, 5 November 2020. Says 'VANOS units are a known issue for all BMWs of this era, but the S54 has a unique twist', 'tabs on the camshaft hubs have a tendency to break off and find themselves in the timing chain', and that the VANOS service should include the updated camshaft hubs."
  - title: "BMW M3 (E46) | PH Used Buying Guide"
