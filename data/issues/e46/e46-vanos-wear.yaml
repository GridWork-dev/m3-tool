    note: "By PH Staff, 1 April 2021 (a UK guide that concentrates on Euro-spec cars). Says 'The double VANOS variable valve timing is more robust on the E46 M3 than it was on the E36 version. However, the VANOS bolts can loosen at around 70,000 miles. If they break, it can ruin the engine, but stronger replacement bolts are available from BMW.'"
