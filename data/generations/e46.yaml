# BMW M3 (E46), 2000-2006. Every value below was checked against the sources cited here on
# 2026-11-23 and 2026-11-24. Values with no source (the driver eye point) say so.
# ST041 is a third-party copy of BMW training material and Tier 2 under data.md's rule for copies
# (R77): the file has no issuer line and no module number. No value here rests on it alone. The
# engine's displacement and cylinder count are in the owner's manual and BMW's press kit (Tier 1),
# the engine code S54B32 is in BMW NA's service bulletin SI B 11 04 04 (Tier 1), and the coupe's
# dimensions are in the owner's manual (Tier 1).
id: e46
name: M3 (E46)
chassis: E46
years: [2000, 2006]
engines:
  - code: S54B32
    displacementCc: 3246
    cylinders: 6
bodies: [coupe, convertible]
# Sources for name, chassis, years, engines and bodies. Dimensions, the eye point and fitment carry
# their own.
sources:
  - title: "International presskit: Twenty Years of the BMW M3"
    publisher: BMW Group
    url: https://newsroom.bmwgroup.com/emea/international-presskit--twenty-years-of-the-bmw-m3
    tier: 1
    accessed: 2026-11-24
    note: 'BMW Media Information 7/2007. Lists "BMW M3 (E46)" with a coupe and a convertible, dates the coupe''s debut to 2000 and the convertible to 2001, says production of the E46-based M3 ended in 2006, gives the engine as a straight-six displacing 3,246 cc, and says that engine is ''the first power unit suitable for all countries and national specifications'', throttled to 333 SAE-hp on the US version.'
  - title: "BMW M3 Owner's Manual, online edition for part no. 01 41 0 157 628 (09/03): Engine data, p. 150"
    publisher: BMW AG
    url: https://archive.org/download/manualsonline-id-d3b68d3e-dade-4bda-875b-3716cdeabf3f/d3b68d3e-dade-4bda-875b-3716cdeabf3f.pdf
    tier: 1
    accessed: 2026-11-23
    note: "Archive.org copy. Displacement 198.1 cu in / 3,246 cm3, 6 cylinders, bore 87 mm, stroke 91 mm."
  - title: "SI B 11 04 04: Service Action: E46 M3 S54 Connecting Rod Bearings Replacement (October 2004)"
    publisher: BMW of North America, LLC
    url: https://web.archive.org/web/20240714182416/https://cdn.shopify.com/s/files/1/0533/1684/5721/files/S54_Bearing_shell_Service_Bulletin.pdf?v=1692985245
    tier: 1
    accessed: 2026-11-24
    note: "BMW service bulletin, a third-party copy: the file was published on cdn.shopify.com, a Shopify store's CDN, not by BMW, and the url is the existing Wayback snapshot of 2024-07-14 of that file, which is byte-identical to the vendor's file (same SHA-256 on 2026-11-24; no snapshot was created). Tier 1 under data.md's rule for copies (R77), judged as in e46-rod-bearing-wear-us: the file is the whole 12-page native PDF (created 1 October 2004 according to its metadata, with a 2004 BMW NA copyright line), not retyped; its number and scope are corroborated by Jalopnik ('SIB 11-04-04', a service action on early 2001 to 2003 cars). The Q&A and the two customer letters it lists as attachments are not in the copy. Its header says it 'supersedes SI B11 04 04 dated October 2004'. Used here only for the engine code: its model line reads 'E46 M3 coupe/convertible with S54B32 engine produced from 02/12/2001 up to 05/22/2003'. That range is the bulletin's affected range, not the engine's run: BMW's press kit (above) describes the one engine for the whole generation. The bulletin is a BMW NA document, so it names the code for the US cars; under R85 (data.md, 'What counts as verified') the code covers every market, because the press kit, an independent Tier 1 document for all markets, says of the 3,246 cc straight-six 'One engine for all countries.' and that it is throttled on the US version. Its repair content is not used."
  - title: "ST041 M3 Complete Vehicle: E46 M3 Technical Data"
    publisher: BMW Technical Training
    url: https://archive.org/download/BMWTechnicalTrainingDocuments/ST041%20M3%20Complete%20Vehicle/1%20M3%20Complete%20Vehicle.pdf
    tier: 2
    accessed: 2026-11-24
    note: "Copy hosted on archive.org; the file carries no publisher line. Tier 2 under data.md's rule for copies (R77): the file has no issuer line and no module number (its cover gives only 'Model: E46 M3' and 'Production Date: 01/2001'), so the manufacturer's identifiers are not intact, and it is one chapter ('1 M3 Complete Vehicle', 22 pages) of a multi-file module, not the whole document. Its engine table gives engine type S54B32 (in-line, 6-cylinder, 4-valve) and engine size 3246 ccm, and its text calls the engine one that 'is used worldwide'. The displacement and cylinder count also rest on the owner's manual and BMW's press kit (Tier 1) and the engine code on SI B 11 04 04 (Tier 1), so no value here depends on this copy."
  - title: BMW M3 E46 [2000 .. 2006] wheel fitment, 3.2i (S54B32)
    publisher: Koleso.ee (Astela OÜ)
    url: https://koleso.ee/en/valuveljed/bmw/m3/263/e46-2000-2006/544
    tier: 3
    accessed: 2026-11-23
    note: 'Tire retailer''s page. Lists generation "E46 [2000 .. 2006]", production 2000 - 2006, engine "3.2 L, S54B32, I6".'
dimensions:
  coupe:
    lengthMm: 4492
    widthMm: 1780
    heightMm: 1372
    wheelbaseMm: 2731
    trackFrontMm: 1508
    trackRearMm: 1525
    sources:
      - title: "BMW M3 Owner's Manual, online edition for part no. 01 41 0 157 628 (09/03): Dimensions, p. 151"
        publisher: BMW AG
        url: https://archive.org/download/manualsonline-id-d3b68d3e-dade-4bda-875b-3716cdeabf3f/d3b68d3e-dade-4bda-875b-3716cdeabf3f.pdf
        tier: 1
        accessed: 2026-11-23
        note: "Archive.org copy of the US-market M3 manual (power in hp, sizes in inches). The drawing on p. 151 gives length 4,492, width 1,780, height 1,372, wheelbase 2,731, front track 1,508 and rear track 1,525 mm. It also shows a 1,924 mm width on the rear view, which is not used here."
      - title: "ST041 M3 Complete Vehicle: E46 M3 Technical Data"
        publisher: BMW Technical Training
        url: https://archive.org/download/BMWTechnicalTrainingDocuments/ST041%20M3%20Complete%20Vehicle/1%20M3%20Complete%20Vehicle.pdf
        tier: 2
        accessed: 2026-11-24
        note: "BMW training module for the E46 M3 coupe (production date 01/2001), copy hosted on archive.org; the file carries no publisher line. Tier 2 under data.md's rule for copies (R77): the file has no issuer line and no module number, so the manufacturer's identifiers are not intact, and it is one chapter ('1 M3 Complete Vehicle', 22 pages) of a multi-file module, not the whole document. Its specifications table gives length 4492, width 1780, height (unladen) 1372 and wheelbase 2731 mm, and engine type S54B32. It has no track widths. The owner's manual (Tier 1) gives all six dimensions, so no coupe value depends on this copy."
driverEyePoint:
  xMm: -370
  yMm: 1100
  zMm: 0
  basis: estimated
  note: Placeholder estimate. The 3D lane replaces it with a value measured from the interior asset.
  sources: []
# Stock here is the 18-inch wheel that Koleso.ee labels OEM for the 3.2i, and that Hubcap Haven lists
# as Style 67 at 18x8 (front) and 18x9 (rear). The sources also show 19-inch sizes (225/40 ZR 19 and
# 255/35 ZR 19 in the owner's manual, 19x8 ET47 and 19x9.5 ET27 at BimmerWorld). Those are not
# modelled.
# Below data.md's verification rule (no Tier 1 source and fewer than two distinct Tier 2
# publishers), now that Koleso.ee is Tier 3, and listed in the `unverified` field at the end of
# this file (data.md, "Unverified values"): the stock offsets on both axles, because Hubcap
# Haven is the only Tier 2 publisher, and the stock widths for the European cars, because a US
# document does not speak for them. BMW NA's 2006 press kit (Tier 1) gives the widths of 8 and 9
# inches for the US cars.
# The stock tire sizes (owner's manual, Tier 1), the 5x120 bolt pattern (Apex's E46 M3
# page, Tier 1, and Hubcap Haven and BimmerWorld) and the 72.56 mm center bore (Apex's E46 M3
# page, Tier 1, and BimmerWorld) meet the rule. Apex states the bore its own wheel is made with
# ('N/A Direct fit'), not a BMW statement of the hub, and BimmerWorld independently gives 72.56.
fitment:
  front:
    boltPattern: 5x120
    centerBoreMm: 72.56
    stock:
      diameterIn: 18
      widthIn: 8
      offsetMm: 47
      tire: 225/45ZR18
    envelopes: []
  rear:
    boltPattern: 5x120
    centerBoreMm: 72.56
    stock:
      diameterIn: 18
      widthIn: 9
      offsetMm: 26
      tire: 255/40ZR18
    envelopes: []
  sources:
    - title: BMW E46 M3 Wheels
      publisher: Apex Wheels
      url: https://web.archive.org/web/20260812175415/https://apexwheels.com/vehicles/bmw/m3/e46-m3
      tier: 1
      accessed: 2026-11-23
      note: "Archived copy (web.archive.org snapshot of 2026-08-12) of the manufacturer's E46 M3 vehicle page, 'for your 2001-2006 BMW E46 M3'. Its specification table (shown for the VS-5RS) gives bolt pattern 5x120mm, center bore 72.56mm and centering ring 'N/A Direct fit' for the E46 M3 fitment, on front and rear. Source for the center bore of 72.56 mm and a Tier 1 source for the 5x120 bolt pattern. Apex states the bore its own wheel is made with ('N/A Direct fit' means no centering ring), which is a manufacturer's statement about its wheel and not a BMW statement of the hub; BimmerWorld's table independently gives 72.56 for the E46. Apex's wheel sizes are not used here: the wheels in this block are the 18-inch factory ones."
    - title: "BMW M3 Owner's Manual, online edition for part no. 01 41 0 157 628 (09/03): Tire inflation pressure, p. 27"
      publisher: BMW AG
      url: https://archive.org/download/manualsonline-id-d3b68d3e-dade-4bda-875b-3716cdeabf3f/d3b68d3e-dade-4bda-875b-3716cdeabf3f.pdf
      tier: 1
      accessed: 2026-11-23
      note: "Lists tire sizes 225/45 ZR 18 (front) and 255/40 ZR 18 (rear) for the M3, and also lists 225/40 ZR 19 and 255/35 ZR 19. Gives no wheel widths or offsets."
    - title: BMW M3 E46 [2000 .. 2006] wheel fitment, 3.2i (S54B32)
      publisher: Koleso.ee (Astela OÜ)
      url: https://koleso.ee/en/valuveljed/bmw/m3/263/e46-2000-2006/544
      tier: 3
      accessed: 2026-11-23
      note: "Tire retailer's fitment data. Lists the OEM front as 225/45R18 on 8Jx18 ET47 and the OEM rear as 255/40R18 on 9Jx18 ET26, bolt pattern 5x120 and center bore 72.6 mm (a rounding of the 72.56 mm that Apex gives)."
    - title: ALY59367 BMW M3 Wheel/Rim Hyper Silver #36112229950
      publisher: Hubcap Haven
      url: https://www.hubcaphaven.com/p/3015/aly59367-bmw-m3-wheel-hyper-silver-36112229950.html
      tier: 2
      accessed: 2026-11-23
      note: "Retailer listing for a replacement wheel under OE part number 36112229950 (option code Style 67, fitment front): 18x8, 5 lugs, 120 mm bolt pattern, 47 mm offset."
    - title: ALY59368/59607 BMW M3 Wheel/Rim Hyper Silver #36112229960
      publisher: Hubcap Haven
      url: https://www.hubcaphaven.com/p/1705/aly59368-59607-bmw-m3-wheel-hyper-silver-36112229960.html
      tier: 2
      accessed: 2026-11-23
      note: "Retailer listing for a replacement wheel under OE part number 36112229960 (option code Style 67, fitment rear): 18x9, 5 lugs, 120 mm bolt pattern, 26 mm offset."
    - title: "PRESS KIT: 2006 BMW M3 (description, highlights, options and features, pricing)"
      publisher: BMW Group
      url: https://newsroom.bmwgroup.com/americas/press-kit-2006-bmw-m3
      tier: 1
      accessed: 2026-11-23
      note: "BMW of North America press kit for the 2006 model year (release dated 15 December 2005), US models only, read from the page's download links. Features table: 'M Double Spoke (design #67M)' 18 x 8.0 front and 18 x 9.0 rear, standard on the coupe and the convertible, with 225/45ZR-18 front and 255/40ZR-18 rear tires. Tier 1 source for the stock widths of 8 and 9 inches on the US cars. It gives no offsets, and a US document does not speak for the European cars, whose widths rest on Hubcap Haven alone at Tier 2."
    - title: BMW Wheel Info and Tech Tips
      publisher: BimmerWorld
      url: https://www.bimmerworld.com/About-Us/Wheel-Info-Tech/
      tier: 2
      accessed: 2026-11-23
      note: "Specialist shop's tech page. Its bolt pattern table gives 5x120 with a 72.56 mm center bore for the 5-lug E-chassis (E46 included), which is the 72.56 used here. Its E46 M3 row lists 19x8.0 ET47 front and 19x9.5 ET27 rear as stock, which differs from the 18-inch sizes used here (Koleso.ee labels those OEM), so it is not used for the wheel sizes."
# Values below data.md's verification rule, as paths (data.md, "Unverified values"). The
# comments at the top of this file say why each one falls short.
unverified:
  # Stock wheel: offsets
  - fitment.front.stock.offsetMm
  - fitment.rear.stock.offsetMm
  # Stock wheel: widths
  - fitment.front.stock.widthIn
  - fitment.rear.stock.widthIn
