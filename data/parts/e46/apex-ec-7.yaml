labor:
  hours: [0.5, 1]
  diy: easy
  estimated: true
model:
  standIn: wheel
  params:
    spokeCount: 7
    spokeStyle: split
claims:
  - "Apex lists the EC-7 in its Flow Formed Classic Line, says it uses 3 unique face profiles, gives a 1,550 lbs load rating on every size whose table I could open, and lists an independent VIA test (reference VIA-17-0645 on the 18x10 ET25)."
  - "Apex's size pages for these sizes are titled 5x120mm / 72.56mm; the tables I could open give a 72.56 mm center bore and 'N/A Direct fit' (no centering ring), a 60 degree conical lug seat and a Gloss Black center cap, and the 18x10 ET25 table says it is designed to fit BMW 5x120 mm center caps."
  - "Apex lists 20.1 lb for the 18x8.5 ET35 (face profile 1)."
  - "Apex lists 20.8 lb for the 18x9 ET30 (face profile 2)."
  - "Apex lists 21.25 lb for the 18x9 ET31 (face profile 2)."
  - "Apex lists 21.8 lb for the 18x9.5 ET22 (face profile 3) (21.75 lb in the 2024 snapshot)."
  - "Apex lists 22.2 lb for the 18x9.5 ET28 (face profile 2)."
  - "Apex lists 21.7 lb for the 18x9.5 ET35 (face profile 2)."
  - "Apex lists 22.45 lb for the 18x10 ET25 (face profile 3) (22.2 lb on the 2025-10 size page; 22.45 lb in the 2024 snapshot)."
  - "Apex lists 22.5 lb for the 18x10.5 ET22 (face profile 3) in the Sizes & Prices table of a 2024 snapshot of its size page."
  - "Apex lists 22.6 lb for the 18x11 ET44 (face profile 3) (23.3 lb in the 2024 snapshot)."
  - "Apex lists 21.9 lb for the 19x8.5 ET35 (face profile 1)."
  - "Apex lists 22.3 lb for the 19x9 ET30 (face profile 2)."
  - "Apex lists 22.9 lb for the 19x9.5 ET22 (face profile 3)."
  - "Apex lists about 24 lb for the 19x9.5 ET33 (face profile 3)."
  - "Apex's 19x9.5 ET35 page lists 24.0 lb (face profile 3) but its table shows 'Offset 33mm', so the figure may be the 19x9.5 ET33's (about 24 lb)."
  - "Apex lists 23.5 lb for the 19x10 ET25 (face profile 3)."
  - "Apex lists 23.9 lb for the 19x10.5 ET22 (face profile 3)."
  - "Apex shows no weight I could open for the 19x10.5 ET25: I could not open an archived copy of its size page, and the 2024 table predates it."
  - "Apex's E46 M3 fitment guide lists these EC-7 staggered setups, front / rear: 18x8.5 ET35 / 18x9.5 ET22 (OEM+); 19x8.5 ET35 / 19x9.5 ET22 (OEM+); 18x9 ET30 / 18x10 ET25 (aggressive street, and performance street and track); 18x9.5 ET35 / 18x10.5 ET22; 18x9.5 ET22 / 18x10.5 ET22; 19x9 ET30 / 19x10 ET25; 19x9.5 ET33 or ET35 / 19x10.5 ET22 or ET25 (aggressive street); 18x9.5 ET22 / 18x10 ET25 and 18x10 ET25 / 18x11 ET44 (race)."
  - "Apex's E46 M3 fitment guide states these requirements for the EC-7 race setups: the staggered 18x10 ET25 / 18x11 ET44 needs rear spacers of 20 mm or more and rolled or pulled fenders to prevent fender arch rubbing, front negative camber, and front spacers of 5 mm or more with certain aftermarket suspensions; the square 18x11 ET44 'with spacers' needs front and rear spacers of 20 mm or more, negative camber on both axles, and rolled and/or pulled fenders or flares on both axles; the staggered 18x9.5 ET22 / 18x10 ET25 needs front negative camber and no spacers; the square 18x10 ET25 needs front negative camber and, with certain aftermarket suspensions, front spacers of 5 mm or more."
  - "Apex's E46 M3 fitment guide states these requirements for the other EC-7 setups: the square performance setups need at least 1.5 degrees (18x9.5 ET35), 2 degrees (18x9.5 ET28) or 3 degrees (18x9.5 ET22 and 18x10 ET25) of front negative camber, and the ET35 may need front spacers of 5 mm or more with certain aftermarket suspensions; the aggressive 18x9.5 ET22 / 18x10.5 ET22 needs at least 2.5 degrees of front negative camber; the aggressive 18x9.5 ET35 / 18x10.5 ET22 and 19x9.5 ET33 or ET35 / 19x10.5 ET22 or ET25 need front spacers of 5 mm or more with certain aftermarket suspensions; the wider 18-inch aggressive setups may need rear negative camber or rolled fenders; the OEM+, winter and performance 18x9 ET30 / 18x10 ET25 setups are direct fit, with front fender liner rubbing possible with some tires and ride heights."
  - "Apex's E46 M3 fitment guide lists these EC-7 square setups, front and rear the same: 18x9 ET30 or ET31 (OEM+); 18x9.5 ET35, ET28 or ET22 and 18x10 ET25 (performance street and track); 18x10 ET25 and 18x11 ET44 with 20 mm or larger spacers (race); 18x8.5 ET35 for winter."
sources:
  - title: "EC-7 Wheels"
    publisher: "Apex Wheels"
