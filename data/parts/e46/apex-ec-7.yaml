    note: "Archived copy (web.archive.org snapshot of 2026-08-12) of Apex's E46 M3 vehicle page: 'Lightweight forged & flow formed Apex wheels for your 2001-2006 BMW E46 M3'. Source for the 2001 to 2006 years, which is Apex's range: the Euro coupe variant starts in 2000, and a 2000 car would take the wheel, so `fits.years` follows the source and not the car. It lists the EC-7 among the flow formed Classic Line wheels; its size list is for all designs, and its specification table (shown for the VS-5RS) gives bolt pattern 5x120mm, center bore 72.56mm and centering ring 'N/A Direct fit' for the E46 M3 fitment, which agrees with the EC-7 tables."
