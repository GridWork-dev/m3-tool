    tier: 1
    accessed: 2026-11-23
    note: "Archived copy (web.archive.org snapshot of 2026-08-12) of the manufacturer's EC-7 product page. Part of the Flow Formed Classic Line. Specification table for the size the page shows, 18x10 ET25: face profile 3, bolt pattern 5x120mm, center bore 72.56mm, centering ring 'N/A Direct fit', lug seat 60 Degree Conical, OEM cap compatible ('Designed to fit BMW 5x120mm center caps'), load rating 1,550 lbs, weight 22.45 lbs, tested by VIA (VIA-17-0645). The size list on the page covers every vehicle; the E46 M3 subset comes from the fitment guide. The 22.45 lbs disagrees with the 22.2 lbs on the older 18x10 ET25 size page below; the newer figure is used. The page also lists prices, which are not recorded."
  - title: "BMW E46 M3 Wheel & Tire Fitment Guide"
    publisher: "Apex Wheels"
    url: https://web.archive.org/web/20260212140400/https://apexwheels.com/fitment-guides/bmw/m3/bmw-e46-m3-wheel-and-tire-fitment-guide
    tier: 1
    accessed: 2026-11-23
    note: "Archived copy (web.archive.org snapshot of 2026-02-12) of Apex's E46 M3 guide. It addresses the '2001-2006 BMW E46 M3' (base car, competition package car and CSL) without separating coupe and convertible, so `bodies` is left out of `fits`. Every setup has an 'Available in' list; the flow formed EC-7 (not the forged EC-7RS or EC-7R) is in the lists for the staggered and square setups in the claims, and for the sizes recorded as options. Apex also lists 18x8.5 ET38 (ARC-8) and ET40, and 19x9 ET28, which the EC-7 size list does not offer, so those are not recorded. The axle on each option is where the guide uses the size: both when it appears on both axles (a square setup, or a rear in one setup and a front in another). The requirements the guide states per setup (spacers, camber, fender work) are in the claims, for example rear spacers of 20 mm or more and rolled or pulled fenders on the race staggered 18x10 ET25 / 18x11 ET44, and spacers, camber and fender work on both axles on the race square 18x11 ET44. The bolt pattern and center bore of 18x10.5 ET22 come from the 2024 Sizes & Prices table below, and those of 19x10.5 ET25 from this guide and the vehicle page, because no size table for it could be opened."
