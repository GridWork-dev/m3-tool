name: deploy

# Production deploys from main and per-PR preview versions on Cloudflare Workers (ADR 0011).
# This workflow needs secrets, so it is not a required status check. The merge gate stays
# check, e2e and gitleaks (see ci.yml).
#
# Two jobs, so the secrets never meet project code:
#   build   checks out the repo, installs its dependencies and builds. It has no secrets.
#   deploy  gets only the built files. It runs a pinned wrangler with the Cloudflare secrets set
#           on the two wrangler steps, and nothing else in the job can read them.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Forks get no secrets, and a bot's PR (Renovate, Dependabot) carries dependency changes that
    # nobody has read, so neither gets a deploy. A push to main always does. The build job has the
    # same condition as the deploy job, so a skipped deploy doesn't leave a build nobody uses.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      !endsWith(github.actor, '[bot]') &&
      !endsWith(github.event.pull_request.user.login, '[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # No secrets here, at any level. This job runs dependency code (install, build).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:data
      - run: pnpm build
      - run: pnpm check:links
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: |
            dist/
            wrangler.jsonc
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  deploy:
    needs: build
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      !endsWith(github.actor, '[bot]') &&
      !endsWith(github.event.pull_request.user.login, '[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    # A fresh runner: no checkout, no install, no project code. It has the built site and
    # wrangler.jsonc from the build job, and a pinned wrangler fetched with npx. The Cloudflare
    # secrets are set on the two wrangler steps only. The wrangler version must match package.json
    # (tests/unit/workflows.test.ts checks it).
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1

      - name: Deploy to production
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.M3_CF_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.M3_CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4.167.0 deploy

      # After the production deploy: the live site must carry the notice, and an unknown path must
      # be a 404. Retries cover the moment before the new version is live. No secrets are needed.
      - name: Smoke test production
        if: github.event_name == 'push'
        shell: bash
        run: |
          base='https://m3-tool.broken-wood-97a9.workers.dev'
          notice='Not affiliated with, endorsed by, or sponsored by BMW AG'
          for attempt in 1 2 3 4 5 6; do
            rm -f home.html
            home="$(curl -sS --max-time 20 -o home.html -w '%{http_code}' "$base/" || true)"
            nope="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$base/__nope" || true)"
            found=no
            if [ -f home.html ] && tr -s '[:space:]' ' ' < home.html | grep -qF "$notice"; then found=yes; fi
            if [ "$home" = 200 ] && [ "$nope" = 404 ] && [ "$found" = yes ]; then
              echo "Smoke test passed on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt: / gave '$home' (want 200), /__nope gave '$nope' (want 404), notice found: $found. Retrying in 10 seconds."
            sleep 10
          done
          echo "::error::The production site failed the smoke test: it needs a 200 on / with the not-affiliated notice, and a 404 on /__nope."
          exit 1

      - name: Upload preview version
        if: github.event_name == 'pull_request'
        id: preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.M3_CF_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.M3_CF_ACCOUNT_ID }}
          PREVIEW_ALIAS: pr-${{ github.event.number }}
        run: |
          npx --yes wrangler@4.167.0 versions upload --preview-alias "$PREVIEW_ALIAS" | tee wrangler-output.txt
          url="$(awk '/^Version Preview Alias URL:/ { print $NF; exit }' wrangler-output.txt)"
          if [ -z "$url" ]; then
            echo "::error::wrangler did not print a 'Version Preview Alias URL' line"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on the PR
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          MERGE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- m3-tool-preview -->'
          body="$(printf '%s\nPreview: %s\n\nBuilt from merge commit %s (PR head %s merged into the base branch).' \
            "$marker" "$PREVIEW_URL" "$MERGE_SHA" "$HEAD_SHA")"
          existing="$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")"
          existing="${existing%%$'\n'*}"
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$existing" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          fi
